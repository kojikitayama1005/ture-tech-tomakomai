<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TURE-TECH学生一覧</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // 初期評価項目5つ
        const EVAL_ITEMS = [
            "論点整理・前提理解",
            "課題特定",
            "根拠・論拠の明確さ",
            "巻き込み・合意形成",
            "他者尊重"
        ];

        // グラフ描画用の5項目カラー定義
        const ITEM_COLORS = [
            '#0284c7', // スカイブルー (論点整理)
            '#16a34a', // グリーン (課題特定)
            '#d97706', // アンバー (根拠・論拠)
            '#9333ea', // パープル (巻き込み)
            '#e11d48'  // ローズ (他者尊重)
        ];

        // 初期サンプルの学生データ
        const INITIAL_STUDENTS = [
            { id: "s1", name: "佐藤 拓海", group: "1班", kana: "サトウ タクミ" },
            { id: "s2", name: "鈴木 葵", group: "1班", kana: "スズキ アオイ" },
            { id: "s3", name: "高橋 陸", group: "2班", kana: "タカハシ リク" },
            { id: "s4", name: "田中 結衣", group: "2班", kana: "タナカ ユイ" },
            { id: "s5", name: "渡辺 翔太", group: "3班", kana: "ワタナベ ショウタ" },
            { id: "s6", name: "伊藤 凛", group: "3班", kana: "イトウ リン" }
        ];

        const STORAGE_KEYS = {
            STUDENTS: 'turetech_students_v3',
            EVALS: 'turetech_evaluations_v3',
            ROLE: 'turetech_user_role_v3',
            EVALUATOR_NAME: 'turetech_evaluator_name',
            EVALUATOR_TYPE: 'turetech_evaluator_type'
        };

        const loadLocal = (key, defaultVal) => {
            try {
                const item = localStorage.getItem(key);
                return item ? JSON.parse(item) : defaultVal;
            } catch (e) {
                return defaultVal;
            }
        };

        const saveLocal = (key, val) => {
            try {
                localStorage.setItem(key, JSON.stringify(val));
            } catch (e) {
                console.error("Save local error:", e);
            }
        };

        function AuthModal({ isOpen, onClose, onSuccess }) {
            const [code, setCode] = useState('');
            const [error, setError] = useState(false);

            if (!isOpen) return null;

            const handleSubmit = (e) => {
                e.preventDefault();
                if (code === '1234') {
                    onSuccess();
                    setCode('');
                    setError(false);
                } else {
                    setError(true);
                }
            };

            return (
                <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl">
                        <div className="text-center mb-4">
                            <div className="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-2 text-xl">
                                <i className="fas fa-lock"></i>
                            </div>
                            <h3 className="font-bold text-slate-800 text-lg">運営権限の確認</h3>
                            <p className="text-xs text-slate-500 mt-1">パスコードを入力してください</p>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <input
                                type="password"
                                value={code}
                                onChange={(e) => { setCode(e.target.value); setError(false); }}
                                placeholder="パスコード"
                                autoFocus
                                className={`w-full px-4 py-3 rounded-xl border text-center text-xl tracking-widest outline-none transition ${
                                    error ? 'border-rose-500 bg-rose-50 ring-2 ring-rose-200' : 'border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200'
                                }`}
                            />
                            {error && <p className="text-xs text-rose-500 text-center font-medium">パスコードが違います</p>}
                            <div className="flex gap-2 pt-2">
                                <button
                                    type="button"
                                    onClick={onClose}
                                    className="flex-1 py-2.5 rounded-xl border border-slate-300 text-slate-600 text-sm font-medium hover:bg-slate-50"
                                >
                                    キャンセル
                                </button>
                                <button
                                    type="submit"
                                    className="flex-1 py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700 shadow-md shadow-indigo-200"
                                >
                                    認証
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function EvalModal({ student, evalItems, onClose, onSave }) {
            const [evaluatorRole, setEvaluatorRole] = useState(() => loadLocal(STORAGE_KEYS.EVALUATOR_TYPE, 'メンター'));
            const [evaluatorName, setEvaluatorName] = useState(() => loadLocal(STORAGE_KEYS.EVALUATOR_NAME, ''));
            const [scores, setScores] = useState(() => {
                const init = {};
                evalItems.forEach(item => init[item] = 3);
                return init;
            });
            const [comment, setComment] = useState('');

            if (!student) return null;

            const isNameValid = evaluatorName.trim().length > 0;
            const isCommentValid = comment.trim().length > 0;
            const isValid = isNameValid && isCommentValid;

            const handleScoreChange = (item, val) => {
                setScores(prev => ({ ...prev, [item]: val }));
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!isValid) return;

                // 選択状態をLocalStorageに保持
                saveLocal(STORAGE_KEYS.EVALUATOR_TYPE, evaluatorRole);
                saveLocal(STORAGE_KEYS.EVALUATOR_NAME, evaluatorName.trim());

                const now = new Date();
                const timestampStr = `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

                onSave({
                    id: 'ev_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                    studentId: student.id,
                    evaluatorRole,
                    evaluatorName: evaluatorName.trim(),
                    scores,
                    comment: comment.trim(),
                    timestamp: timestampStr,
                    rawTimestamp: now.getTime()
                });
            };

            return (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-4 overflow-y-auto">
                    <div className="bg-white rounded-2xl w-full max-w-lg shadow-2xl my-auto overflow-hidden flex flex-col max-h-[90vh]">
                        {/* ヘッダー */}
                        <div className="bg-slate-900 text-white p-4 flex justify-between items-center shrink-0">
                            <div>
                                <span className="bg-indigo-500/30 text-indigo-300 text-xs font-semibold px-2.5 py-0.5 rounded-full border border-indigo-400/30 mr-2">
                                    {student.group}
                                </span>
                                <h3 className="text-lg font-bold inline-block">{student.name} の入力</h3>
                            </div>
                            <button onClick={onClose} className="text-slate-400 hover:text-white p-1">
                                <i className="fas fa-times text-xl"></i>
                            </button>
                        </div>

                        {/* フォーム入力エリア */}
                        <form onSubmit={handleSubmit} className="p-4 sm:p-6 overflow-y-auto space-y-5">
                            {/* 記入者設定 */}
                            <div className="bg-slate-50 p-3.5 rounded-xl border border-slate-200 space-y-3">
                                <div className="flex items-center justify-between text-xs font-bold text-slate-700">
                                    <span>記入者情報 <span className="text-rose-500">*必須</span></span>
                                </div>
                                <div className="grid grid-cols-2 gap-2">
                                    <button
                                        type="button"
                                        onClick={() => setEvaluatorRole('メンター')}
                                        className={`py-2 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1.5 ${
                                            evaluatorRole === 'メンター' 
                                                ? 'bg-indigo-600 text-white shadow-sm' 
                                                : 'bg-white text-slate-600 border border-slate-200'
                                        }`}
                                    >
                                        <i className="fas fa-user-tie"></i> 👨‍🏫 メンター
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setEvaluatorRole('サポーター')}
                                        className={`py-2 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1.5 ${
                                            evaluatorRole === 'サポーター' 
                                                ? 'bg-teal-600 text-white shadow-sm' 
                                                : 'bg-white text-slate-600 border border-slate-200'
                                        }`}
                                    >
                                        <i className="fas fa-handshake"></i> 🤝 サポーター
                                    </button>
                                </div>
                                <input
                                    type="text"
                                    value={evaluatorName}
                                    onChange={(e) => setEvaluatorName(e.target.value)}
                                    placeholder="記入者の名前を入力してください（必須）"
                                    className="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-sm outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
                                />
                            </div>

                            {/* スコア入力 */}
                            <div className="space-y-4">
                                <h4 className="text-xs font-bold text-slate-500 uppercase tracking-wider">評価項目 (1〜5点)</h4>
                                {evalItems.map((item, idx) => (
                                    <div key={item} className="space-y-1.5">
                                        <div className="flex justify-between text-sm font-medium">
                                            <span className="text-slate-700">{item}</span>
                                            <span className="font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded text-xs">
                                                {scores[item]} 点
                                            </span>
                                        </div>
                                        <div className="flex gap-1.5">
                                            {[1, 2, 3, 4, 5].map(val => (
                                                <button
                                                    key={val}
                                                    type="button"
                                                    onClick={() => handleScoreChange(item, val)}
                                                    className={`flex-1 py-2 rounded-lg font-bold text-xs transition ${
                                                        scores[item] === val 
                                                            ? 'bg-indigo-600 text-white shadow-md shadow-indigo-200 scale-105' 
                                                            : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                                                    }`}
                                                >
                                                    {val}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {/* 所感メモ（必須） */}
                            <div className="space-y-1.5">
                                <div className="flex justify-between items-center text-xs font-bold text-slate-700">
                                    <label>所感・定性メモ <span className="text-rose-500">*必須</span></label>
                                </div>
                                <textarea
                                    value={comment}
                                    onChange={(e) => setComment(e.target.value)}
                                    rows="3"
                                    placeholder="各学生の所感を入力してください"
                                    className="w-full p-3 border border-slate-300 rounded-xl text-sm outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 resize-none"
                                ></textarea>
                            </div>

                            {/* 保存ボタン */}
                            <button
                                type="submit"
                                disabled={!isValid}
                                className={`w-full py-3 rounded-xl font-bold text-sm shadow-lg transition flex items-center justify-center gap-2 ${
                                    isValid 
                                        ? 'bg-indigo-600 hover:bg-indigo-700 text-white shadow-indigo-200' 
                                        : 'bg-slate-200 text-slate-400 cursor-not-allowed shadow-none'
                                }`}
                            >
                                <i className="fas fa-check"></i> 保存する
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        function DetailModal({ student, evaluations, evalItems, userRole, onClose, onOpenEval }) {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            // 古い順にソートして個別の点数推移を作成
            const sortedEvals = useMemo(() => {
                return [...evaluations].sort((a, b) => (a.rawTimestamp || 0) - (b.rawTimestamp || 0));
            }, [evaluations]);

            useEffect(() => {
                if (chartRef.current && sortedEvals.length > 0) {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }

                    const labels = sortedEvals.map(e => e.timestamp || '記録');
                    
                    // 5項目それぞれの折れ線データセットを生成
                    const datasets = evalItems.map((item, idx) => {
                        const color = ITEM_COLORS[idx % ITEM_COLORS.length];
                        return {
                            label: item,
                            data: sortedEvals.map(e => (e.scores && e.scores[item] !== undefined) ? e.scores[item] : null),
                            borderColor: color,
                            backgroundColor: color,
                            borderWidth: 2,
                            pointRadius: 4,
                            pointHoverRadius: 6,
                            tension: 0.2,
                            spanGaps: true
                        };
                    });

                    const ctx = chartRef.current.getContext('2d');
                    chartInstance.current = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: datasets
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                y: {
                                    min: 1,
                                    max: 5,
                                    ticks: { stepSize: 1, font: { size: 10 } },
                                    grid: { color: 'rgba(226, 232, 240, 0.8)' }
                                },
                                x: {
                                    ticks: { font: { size: 9 }, maxRotation: 45 }
                                }
                            },
                            plugins: {
                                legend: {
                                    display: true,
                                    position: 'bottom',
                                    labels: {
                                        boxWidth: 8,
                                        usePointStyle: true,
                                        font: { size: 9 },
                                        padding: 6
                                    }
                                },
                                tooltip: {
                                    callbacks: {
                                        label: (context) => ` ${context.dataset.label}: ${context.parsed.y}点`
                                    }
                                }
                            }
                        }
                    });
                }
                return () => {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }
                };
            }, [sortedEvals, evalItems]);

            if (!student) return null;

            return (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-4 overflow-y-auto">
                    <div className="bg-white rounded-2xl w-full max-w-2xl shadow-2xl my-auto overflow-hidden flex flex-col max-h-[92vh]">
                        {/* モーダルヘッダー */}
                        <div className="bg-slate-900 text-white p-4 flex justify-between items-center shrink-0">
                            <div>
                                <span className="bg-indigo-500/30 text-indigo-300 text-xs font-semibold px-2.5 py-0.5 rounded-full border border-indigo-400/30 mr-2">
                                    {student.group}
                                </span>
                                <h3 className="text-xl font-bold inline-block">{student.name} カルテ</h3>
                            </div>
                            <button onClick={onClose} className="text-slate-400 hover:text-white p-1">
                                <i className="fas fa-times text-xl"></i>
                            </button>
                        </div>

                        {/* ボディ */}
                        <div className="p-4 sm:p-6 overflow-y-auto space-y-6">
                            {/* 折れ線グラフエリア（5項目推移） */}
                            <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2">
                                <div className="flex justify-between items-center">
                                    <h4 className="font-bold text-slate-800 text-sm flex items-center gap-2">
                                        <i className="fas fa-chart-line text-indigo-600"></i> 評価項目別 スコア推移 (5項目)
                                    </h4>
                                    <span className="text-xs text-slate-500 font-medium">全 {sortedEvals.length} 回の記録</span>
                                </div>
                                {sortedEvals.length > 0 ? (
                                    <div className="h-60 w-full relative pt-2">
                                        <canvas ref={chartRef}></canvas>
                                    </div>
                                ) : (
                                    <p className="text-center text-xs text-slate-400 py-10">まだ入力記録がありません</p>
                                )}
                            </div>

                            {/* 入力ボタン（クイックアクセスコール） */}
                            <div className="flex justify-end">
                                <button
                                    onClick={() => { onClose(); onOpenEval(student); }}
                                    className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow-md flex items-center gap-2"
                                >
                                    <i className="fas fa-pencil-alt"></i> この学生の所感を入力する
                                </button>
                            </div>

                            {/* 過去ログ一覧 */}
                            <div className="space-y-3">
                                <h4 className="font-bold text-slate-800 text-sm flex items-center gap-2">
                                    <i className="fas fa-history text-slate-500"></i> 入力・所感履歴
                                </h4>
                                {sortedEvals.length === 0 ? (
                                    <p className="text-center text-xs text-slate-400 py-4">履歴はありません</p>
                                ) : (
                                    <div className="space-y-3">
                                        {[...sortedEvals].reverse().map((ev) => (
                                            <div key={ev.id} className="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm space-y-2">
                                                <div className="flex justify-between items-center text-xs border-b border-slate-100 pb-2">
                                                    <div className="flex items-center gap-1.5 font-bold text-slate-700">
                                                        <span className="bg-slate-100 px-2 py-0.5 rounded text-slate-600">
                                                            {ev.evaluatorRole || 'メンター'}
                                                        </span>
                                                        <span>{ev.evaluatorName || '匿名'}</span>
                                                    </div>
                                                    <span className="text-slate-400">{ev.timestamp}</span>
                                                </div>
                                                {/* 各項目の点数バッジ */}
                                                <div className="flex flex-wrap gap-1.5 pt-1">
                                                    {evalItems.map((item, idx) => (
                                                        <span 
                                                            key={item} 
                                                            className="text-[10px] font-semibold px-2 py-0.5 rounded-full border"
                                                            style={{
                                                                color: ITEM_COLORS[idx % ITEM_COLORS.length],
                                                                borderColor: `${ITEM_COLORS[idx % ITEM_COLORS.length]}40`,
                                                                backgroundColor: `${ITEM_COLORS[idx % ITEM_COLORS.length]}10`
                                                            }}
                                                        >
                                                            {item}: {ev.scores?.[item] ?? '-'}
                                                        </span>
                                                    ))}
                                                </div>
                                                {/* 定性コメント */}
                                                {ev.comment && (
                                                    <p className="text-xs text-slate-700 bg-slate-50 p-2.5 rounded-lg border border-slate-100 whitespace-pre-wrap leading-relaxed mt-2">
                                                        {ev.comment}
                                                    </p>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function SummaryTab({ students, evaluations, evalItems, userRole }) {
            const [selectedGroup, setSelectedGroup] = useState('ALL');
            const [selectedStudentId, setSelectedStudentId] = useState('ALL');

            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            const groups = useMemo(() => ['ALL', ...new Set(students.map(s => s.group))], [students]);
            const groupStudents = useMemo(() => {
                return students.filter(s => selectedGroup === 'ALL' || s.group === selectedGroup);
            }, [students, selectedGroup]);

            // 学生ごとの統計
            const studentStats = useMemo(() => {
                return groupStudents.map(student => {
                    const evs = evaluations.filter(e => e.studentId === student.id);
                    const sorted = [...evs].sort((a, b) => (a.rawTimestamp || 0) - (b.rawTimestamp || 0));

                    let latestScore = 0;
                    if (sorted.length > 0) {
                        const last = sorted[sorted.length - 1];
                        if (last.scores) {
                            const vals = Object.values(last.scores);
                            if (vals.length > 0) {
                                latestScore = (vals.reduce((a, b) => a + b, 0) / vals.length);
                            }
                        }
                    }

                    return {
                        ...student,
                        evalCount: evs.length,
                        latestScore: parseFloat(latestScore.toFixed(1)),
                        sortedEvals: sorted
                    };
                });
            }, [groupStudents, evaluations]);

            // 折れ線グラフ（特定生徒は5本、全体は平均1本）
            useEffect(() => {
                if (chartRef.current && studentStats.length > 0) {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }

                    let labels = [];
                    let datasets = [];

                    if (selectedStudentId !== 'ALL') {
                        // 特定生徒選択：5項目の推移を表示
                        const st = studentStats.find(s => s.id === selectedStudentId);
                        const targetEvals = st ? st.sortedEvals : [];

                        if (targetEvals.length > 0) {
                            labels = targetEvals.map(e => e.timestamp || '記録');
                            datasets = evalItems.map((item, idx) => {
                                const color = ITEM_COLORS[idx % ITEM_COLORS.length];
                                return {
                                    label: item,
                                    data: targetEvals.map(e => (e.scores && e.scores[item] !== undefined) ? e.scores[item] : null),
                                    borderColor: color,
                                    backgroundColor: color,
                                    borderWidth: 2,
                                    pointRadius: 4,
                                    tension: 0.2,
                                    spanGaps: true
                                };
                            });
                        }
                    } else {
                        // 全体／チーム選択時：各入力の平均スコア推移
                        const allEvs = evaluations.filter(e => groupStudents.some(gs => gs.id === e.studentId));
                        const targetEvals = [...allEvs].sort((a, b) => (a.rawTimestamp || 0) - (b.rawTimestamp || 0));

                        if (targetEvals.length > 0) {
                            labels = targetEvals.map(e => {
                                const st = students.find(s => s.id === e.studentId);
                                return `${st ? st.name.split(' ')[0] : ''} (${e.timestamp})`;
                            });

                            const scores = targetEvals.map(e => {
                                if (!e.scores || Object.keys(e.scores).length === 0) return null;
                                const vals = Object.values(e.scores);
                                return (vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1);
                            });

                            datasets = [{
                                label: '全体平均スコア推移',
                                data: scores,
                                borderColor: '#0284c7',
                                backgroundColor: 'rgba(2, 132, 199, 0.1)',
                                borderWidth: 2,
                                pointBackgroundColor: '#0284c7',
                                pointRadius: 4,
                                tension: 0.3,
                                fill: true
                            }];
                        }
                    }

                    if (labels.length > 0) {
                        const ctx = chartRef.current.getContext('2d');
                        chartInstance.current = new Chart(ctx, {
                            type: 'line',
                            data: { labels, datasets },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                scales: {
                                    y: {
                                        min: 1,
                                        max: 5,
                                        ticks: { stepSize: 1, font: { size: 10 } }
                                    },
                                    x: {
                                        ticks: { font: { size: 9 }, maxRotation: 45 }
                                    }
                                },
                                plugins: {
                                    legend: {
                                        display: selectedStudentId !== 'ALL',
                                        position: 'bottom',
                                        labels: {
                                            boxWidth: 8,
                                            usePointStyle: true,
                                            font: { size: 9 },
                                            padding: 6
                                        }
                                    }
                                }
                            }
                        });
                    }
                }
                return () => {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }
                };
            }, [selectedGroup, selectedStudentId, evaluations, evalItems, studentStats, groupStudents]);

            return (
                <div className="space-y-5 pb-12">
                    {/* フィルタコントロール */}
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap gap-3 items-center justify-between">
                        <div className="flex items-center gap-2 w-full sm:w-auto">
                            <span className="text-xs font-bold text-slate-500 whitespace-nowrap">チーム:</span>
                            <div className="flex gap-1 overflow-x-auto no-scrollbar py-1">
                                {groups.map(g => (
                                    <button
                                        key={g}
                                        onClick={() => { setSelectedGroup(g); setSelectedStudentId('ALL'); }}
                                        className={`px-3 py-1.5 rounded-xl text-xs font-bold transition whitespace-nowrap ${
                                            selectedGroup === g 
                                                ? 'bg-indigo-600 text-white shadow-sm' 
                                                : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                                        }`}
                                    >
                                        {g === 'ALL' ? '全チーム' : g}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="flex items-center gap-2 w-full sm:w-auto">
                            <span className="text-xs font-bold text-slate-500 whitespace-nowrap">学生指定:</span>
                            <select
                                value={selectedStudentId}
                                onChange={(e) => setSelectedStudentId(e.target.value)}
                                className="w-full sm:w-48 px-3 py-1.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-bold outline-none focus:border-indigo-500"
                            >
                                <option value="ALL">指定なし (全員)</option>
                                {groupStudents.map(s => (
                                    <option key={s.id} value={s.id}>{s.name} ({s.group})</option>
                                ))}
                            </select>
                        </div>
                    </div>

                    {/* 折れ線グラフカード */}
                    <div className="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                        <div className="flex justify-between items-center">
                            <h3 className="font-bold text-slate-800 text-sm flex items-center gap-2">
                                <i className="fas fa-chart-line text-indigo-600"></i>
                                {selectedStudentId !== 'ALL' ? '個別項目別スコア推移 (5項目)' : '全体スコア推移'}
                            </h3>
                        </div>
                        <div className="h-64 w-full relative">
                            <canvas ref={chartRef}></canvas>
                        </div>
                    </div>

                    {/* 学生スコア概要テーブル */}
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div className="p-4 border-b border-slate-100 font-bold text-sm text-slate-800 flex justify-between items-center">
                            <span>学生入力ステータス概要</span>
                            <span className="text-xs font-normal text-slate-500">{groupStudents.length} 名対象</span>
                        </div>
                        <div className="divide-y divide-slate-100 overflow-x-auto">
                            {studentStats.map(st => (
                                <div key={st.id} className="p-3.5 flex items-center justify-between hover:bg-slate-50 transition min-w-[300px]">
                                    <div className="flex items-center gap-3">
                                        <span className="bg-slate-100 text-slate-600 text-xs font-semibold px-2.5 py-1 rounded-lg">
                                            {st.group}
                                        </span>
                                        <div>
                                            <div className="font-bold text-sm text-slate-800">{st.name}</div>
                                            <div className="text-[10px] text-slate-400">{st.kana}</div>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-4 text-right">
                                        <div>
                                            <div className="text-[10px] text-slate-400">入力数</div>
                                            <div className="font-bold text-xs text-slate-700">{st.evalCount} 回</div>
                                        </div>
                                        <div>
                                            <div className="text-[10px] text-slate-400">直近平均</div>
                                            <div className="font-bold text-sm text-indigo-600">
                                                {st.latestScore > 0 ? `${st.latestScore} 点` : '-'}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function StudentManageTab({ students, onUpdateStudents, onImportBulk }) {
            const [name, setName] = useState('');
            const [group, setGroup] = useState('1班');
            const [kana, setKana] = useState('');
            const [bulkText, setBulkText] = useState('');
            const [tabMode, setTabMode] = useState('single');

            const handleAddSingle = (e) => {
                e.preventDefault();
                if (!name.trim()) return;
                const newStudent = {
                    id: 's_' + Date.now(),
                    name: name.trim(),
                    group,
                    kana: kana.trim() || 'フリガナ未設定'
                };
                onUpdateStudents([...students, newStudent]);
                setName('');
                setKana('');
            };

            const handleBulkSubmit = (e) => {
                e.preventDefault();
                if (!bulkText.trim()) return;
                const lines = bulkText.split('\n');
                const parsed = [];
                lines.forEach((line, idx) => {
                    const parts = line.split(/[,,\t]/).map(s => s.trim()).filter(Boolean);
                    if (parts.length > 0) {
                        parsed.push({
                            id: 's_bulk_' + Date.now() + '_' + idx,
                            name: parts[0],
                            group: parts[1] || '1班',
                            kana: parts[2] || 'フリガナ未設定'
                        });
                    }
                });
                if (parsed.length > 0) {
                    onImportBulk(parsed);
                    setBulkText('');
                }
            };

            const handleDelete = (id) => {
                onUpdateStudents(students.filter(s => s.id !== id));
            };

            return (
                <div className="space-y-6 pb-12">
                    {/* 追加フォーム */}
                    <div className="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                        <div className="flex gap-2 border-b border-slate-100 pb-3">
                            <button
                                onClick={() => setTabMode('single')}
                                className={`px-4 py-2 rounded-xl text-xs font-bold transition ${
                                    tabMode === 'single' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'
                                }`}
                            >
                                1名ずつ追加
                            </button>
                            <button
                                onClick={() => setTabMode('bulk')}
                                className={`px-4 py-2 rounded-xl text-xs font-bold transition ${
                                    tabMode === 'bulk' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'
                                }`}
                            >
                                スプレッドシート一括読込
                            </button>
                        </div>

                        {tabMode === 'single' ? (
                            <form onSubmit={handleAddSingle} className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                <input
                                    type="text"
                                    placeholder="氏名 (例: 山田 太郎)"
                                    value={name}
                                    onChange={(e) => setName(e.target.value)}
                                    className="px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs outline-none focus:border-indigo-500"
                                />
                                <input
                                    type="text"
                                    placeholder="班/チーム (例: 1班)"
                                    value={group}
                                    onChange={(e) => setGroup(e.target.value)}
                                    className="px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs outline-none focus:border-indigo-500"
                                />
                                <button
                                    type="submit"
                                    className="bg-indigo-600 text-white font-bold text-xs py-2 px-4 rounded-xl shadow-md hover:bg-indigo-700"
                                >
                                    学生を追加
                                </button>
                            </form>
                        ) : (
                            <form onSubmit={handleBulkSubmit} className="space-y-3">
                                <p className="text-xs text-slate-500">カンマ区切りまたはタブ区切りで貼り付けてください (形式: 氏名, 班名)</p>
                                <textarea
                                    value={bulkText}
                                    onChange={(e) => setBulkText(e.target.value)}
                                    rows="4"
                                    placeholder="佐藤 拓海, 1班&#10;鈴木 葵, 1班&#10;高橋 陸, 2班"
                                    className="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-xs outline-none focus:border-indigo-500 font-mono"
                                ></textarea>
                                <button
                                    type="submit"
                                    className="bg-indigo-600 text-white font-bold text-xs py-2 px-4 rounded-xl shadow-md hover:bg-indigo-700"
                                >
                                    一括登録を実行
                                </button>
                            </form>
                        )}
                    </div>

                    {/* 一覧表示 */}
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div className="p-4 border-b border-slate-100 font-bold text-sm text-slate-800 flex justify-between items-center">
                            <span>登録済み学生名簿</span>
                            <button
                                onClick={() => { if(confirm('本当に全員削除しますか？')) onUpdateStudents([]); }}
                                className="text-xs text-rose-500 hover:underline font-normal"
                            >
                                全件クリア
                            </button>
                        </div>
                        <div className="divide-y divide-slate-100">
                            {students.map(s => (
                                <div key={s.id} className="p-3.5 flex items-center justify-between hover:bg-slate-50">
                                    <div className="flex items-center gap-3">
                                        <span className="bg-slate-100 text-slate-600 text-xs font-semibold px-2 py-0.5 rounded">
                                            {s.group}
                                        </span>
                                        <span className="font-bold text-sm text-slate-800">{s.name}</span>
                                    </div>
                                    <button
                                        onClick={() => handleDelete(s.id)}
                                        className="text-slate-400 hover:text-rose-500 p-1 text-xs"
                                    >
                                        <i className="fas fa-trash"></i> 削除
                                    </button>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            // ローカルストレージベースの状態管理
            const [students, setStudents] = useState(() => loadLocal(STORAGE_KEYS.STUDENTS, INITIAL_STUDENTS));
            const [evaluations, setEvaluations] = useState(() => loadLocal(STORAGE_KEYS.EVALS, []));
            const [userRole, setUserRole] = useState(() => loadLocal(STORAGE_KEYS.ROLE, 'admin')); // デフォルト管理

            const [activeTab, setActiveTab] = useState('list'); // list, input, summary, manage
            const [selectedGroupFilter, setSelectedGroupFilter] = useState('ALL');
            
            // モーダル管理
            const [evalTargetStudent, setEvalTargetStudent] = useState(null);
            const [detailTargetStudent, setDetailTargetStudent] = useState(null);
            const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
            const [toastMessage, setToastMessage] = useState('');

            // データ保存時の自動永続化
            useEffect(() => { saveLocal(STORAGE_KEYS.STUDENTS, students); }, [students]);
            useEffect(() => { saveLocal(STORAGE_KEYS.EVALS, evaluations); }, [evaluations]);
            useEffect(() => { saveLocal(STORAGE_KEYS.ROLE, userRole); }, [userRole]);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3000);
            };

            const handleSaveEvaluation = (newEval) => {
                setEvaluations(prev => [...prev, newEval]);
                setEvalTargetStudent(null);
                showToast('記録しました');
            };

            const groups = useMemo(() => ['ALL', ...new Set(students.map(s => s.group))], [students]);
            const filteredStudents = useMemo(() => {
                return students.filter(s => selectedGroupFilter === 'ALL' || s.group === selectedGroupFilter);
            }, [students, selectedGroupFilter]);

            return (
                <div className="max-w-3xl mx-auto min-h-screen flex flex-col bg-slate-100">
                    {/* トースト通知 */}
                    {toastMessage && (
                        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2 animate-bounce">
                            <i className="fas fa-check-circle text-teal-400"></i> {toastMessage}
                        </div>
                    )}

                    {/* ヘッダー */}
                    <header className="bg-slate-900 text-white px-4 py-3 sticky top-0 z-30 shadow-md flex justify-between items-center">
                        <div className="flex items-center gap-2 min-w-0">
                            <h1 className="font-extrabold text-base sm:text-lg tracking-tight truncate">TURE-TECH学生一覧</h1>
                        </div>
                        <div className="flex items-center gap-2 shrink-0">
                            <span className="inline-flex items-center gap-1.5 px-2.5 py-1 bg-emerald-500/20 text-emerald-300 rounded-full text-[11px] font-semibold border border-emerald-500/30 shrink-0">
                                <span className="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></span> 同期中
                            </span>
                            <button
                                onClick={() => {
                                    if (userRole === 'admin') {
                                        setUserRole('user');
                                        showToast('メンサポモードに切替ました');
                                    } else {
                                        setIsAuthModalOpen(true);
                                    }
                                }}
                                className={`px-2.5 py-1 rounded-full text-xs font-bold transition flex items-center gap-1 shrink-0 ${
                                    userRole === 'admin' ? 'bg-indigo-600 text-white' : 'bg-slate-700 text-slate-300'
                                }`}
                            >
                                {userRole === 'admin' ? '🔒 運営' : '👤 メンサポ'} (切替)
                            </button>
                        </div>
                    </header>

                    {/* メインコンテンツ */}
                    <main className="flex-1 p-4 pb-20">
                        {/* グループ選択ピル (一覧＆入力タブ用) */}
                        {(activeTab === 'list' || activeTab === 'input') && (
                            <div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-3">
                                {groups.map(g => (
                                    <button
                                        key={g}
                                        onClick={() => setSelectedGroupFilter(g)}
                                        className={`px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition ${
                                            selectedGroupFilter === g 
                                                ? 'bg-slate-800 text-white shadow-sm' 
                                                : 'bg-white text-slate-600 hover:bg-slate-200 border border-slate-200'
                                        }`}
                                    >
                                        {g === 'ALL' ? '全員' : g}
                                    </button>
                                ))}
                            </div>
                        )}

                        {/* 1. 一覧タブ */}
                        {activeTab === 'list' && (
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                {filteredStudents.map(student => {
                                    const studentEvals = evaluations.filter(e => e.studentId === student.id);
                                    return (
                                        <div
                                            key={student.id}
                                            onClick={() => setDetailTargetStudent(student)}
                                            className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition cursor-pointer flex justify-between items-center"
                                        >
                                            <div className="space-y-1">
                                                <span className="bg-slate-100 text-slate-600 text-[10px] font-bold px-2 py-0.5 rounded">
                                                    {student.group}
                                                </span>
                                                <h3 className="font-bold text-base text-slate-800">{student.name}</h3>
                                            </div>
                                            <div className="text-right">
                                                <span className="text-xs text-indigo-600 bg-indigo-50 font-bold px-2.5 py-1 rounded-full">
                                                    記録 {studentEvals.length} 件
                                                </span>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {/* 2. 入力タブ */}
                        {activeTab === 'input' && (
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                {filteredStudents.map(student => (
                                    <div
                                        key={student.id}
                                        className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex justify-between items-center"
                                    >
                                        <div>
                                            <span className="bg-slate-100 text-slate-600 text-[10px] font-bold px-2 py-0.5 rounded">
                                                {student.group}
                                            </span>
                                            <h3 className="font-bold text-base text-slate-800 mt-0.5">{student.name}</h3>
                                        </div>
                                        <button
                                            onClick={() => setEvalTargetStudent(student)}
                                            className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs px-3.5 py-2 rounded-xl shadow-sm flex items-center gap-1.5"
                                        >
                                            <i className="fas fa-pencil-alt"></i> 入力
                                        </button>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* 3. 集計・推移タブ */}
                        {activeTab === 'summary' && (
                            <SummaryTab
                                students={students}
                                evaluations={evaluations}
                                evalItems={EVAL_ITEMS}
                                userRole={userRole}
                            />
                        )}

                        {/* 4. 学生管理タブ */}
                        {activeTab === 'manage' && (
                            <StudentManageTab
                                students={students}
                                onUpdateStudents={setStudents}
                                onImportBulk={(bulk) => setStudents(prev => [...prev, ...bulk])}
                            />
                        )}
                    </main>

                    {/* 下部固定ナビゲーションバー */}
                    <nav className="fixed bottom-0 left-0 right-0 max-w-3xl mx-auto bg-white border-t border-slate-200 z-40 flex justify-around py-2 shadow-lg">
                        <button
                            onClick={() => setActiveTab('list')}
                            className={`flex flex-col items-center gap-1 text-[11px] font-bold px-3 py-1 transition ${
                                activeTab === 'list' ? 'text-indigo-600' : 'text-slate-400'
                            }`}
                        >
                            <i className="fas fa-users text-base"></i> 学生一覧
                        </button>
                        <button
                            onClick={() => setActiveTab('input')}
                            className={`flex flex-col items-center gap-1 text-[11px] font-bold px-3 py-1 transition ${
                                activeTab === 'input' ? 'text-indigo-600' : 'text-slate-400'
                            }`}
                        >
                            <i className="fas fa-pencil-alt text-base"></i> 入力
                        </button>
                        <button
                            onClick={() => setActiveTab('summary')}
                            className={`flex flex-col items-center gap-1 text-[11px] font-bold px-3 py-1 transition ${
                                activeTab === 'summary' ? 'text-indigo-600' : 'text-slate-400'
                            }`}
                        >
                            <i className="fas fa-chart-line text-base"></i> 集計・推移
                        </button>
                        {userRole === 'admin' && (
                            <button
                                onClick={() => setActiveTab('manage')}
                                className={`flex flex-col items-center gap-1 text-[11px] font-bold px-3 py-1 transition ${
                                    activeTab === 'manage' ? 'text-indigo-600' : 'text-slate-400'
                                }`}
                            >
                                <i className="fas fa-cog text-base"></i> 学生管理
                            </button>
                        )}
                    </nav>

                    {/* 各種モーダル */}
                    <AuthModal
                        isOpen={isAuthModalOpen}
                        onClose={() => setIsAuthModalOpen(false)}
                        onSuccess={() => {
                            setUserRole('admin');
                            setIsAuthModalOpen(false);
                            showToast('運営モードに切り替えました');
                        }}
                    />

                    <EvalModal
                        student={evalTargetStudent}
                        evalItems={EVAL_ITEMS}
                        onClose={() => setEvalTargetStudent(null)}
                        onSave={handleSaveEvaluation}
                    />

                    <DetailModal
                        student={detailTargetStudent}
                        evaluations={evaluations.filter(e => e.studentId === detailTargetStudent?.id)}
                        evalItems={EVAL_ITEMS}
                        userRole={userRole}
                        onClose={() => setDetailTargetStudent(null)}
                        onOpenEval={(st) => setEvalTargetStudent(st)}
                    />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
