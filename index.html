<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TURE-TECH学生一覧</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8fafc;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, collection, onSnapshot, setDoc, addDoc, deleteDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'ture-tech-tomakomai-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;

        if (firebaseConfig) {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            window.FirebaseSync = {
                db,
                auth,
                appId,
                doc,
                collection,
                onSnapshot,
                setDoc,
                addDoc,
                deleteDoc,
                getDocs,
                signInAnonymously,
                signInWithCustomToken,
                onAuthStateChanged,
                initialAuthToken: typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null
            };
        } else {
            window.FirebaseSync = null;
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // 指定の評価項目5項目
        const DEFAULT_ITEMS = [
            '論点整理・前提理解',
            '課題特定',
            '根拠・論拠の明確さ',
            '巻き込み・合意形成',
            '他社尊重'
        ];

        // クイックタグリスト
        const QUICK_TAGS = [
            '#ファシリ良し', '#視点鋭い', '#他者傾聴', '#構造化上手',
            '#ロジカル', '#主体性あり', '#和ませ役', '#粘り強い'
        ];

        // 初期サンプルの学生データ
        const INITIAL_STUDENTS = [
            { id: 'st_1', name: '佐藤 拓海', group: '1班', avatar: '👨‍🎓' },
            { id: 'st_2', name: '鈴木 葵', group: '1班', avatar: '👩‍🎓' },
            { id: 'st_3', name: '高橋 健太', group: '2班', avatar: '🧑‍🎓' },
            { id: 'st_4', name: '田中 美咲', group: '2班', avatar: '👩‍🎓' },
            { id: 'st_5', name: '渡辺 翔太', group: '3班', avatar: '👨‍🎓' },
            { id: 'st_6', name: '伊藤 結衣', group: '3班', avatar: '👩‍🎓' }
        ];

        // 初期サンプルの評価データ
        const INITIAL_EVALUATIONS = [
            {
                id: 'e_1',
                studentId: 'st_1',
                evaluatorName: 'メンサポA',
                timestamp: '14:20',
                scores: { '論点整理・前提理解': 5, '根拠・論拠の明確さ': 4 },
                comment: '議論の整理が非常に的確で、前提のズレを素早く修正していた。',
                tags: ['#視点鋭い', '#構造化上手']
            },
            {
                id: 'e_2',
                studentId: 'st_1',
                evaluatorName: 'メンサポB',
                timestamp: '15:10',
                scores: { '巻き込み・合意形成': 5, '他社尊重': 4 },
                comment: '控えめなメンバーにも意見を丁寧に振って全体を巻き込めていた。',
                tags: ['#他者傾聴', '#和ませ役']
            }
        ];

        const Icon = ({ name, className = "w-5 h-5" }) => {
            switch (name) {
                case 'pencil':
                    return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>;
                case 'chart':
                    return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>;
                case 'users':
                    return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>;
                case 'settings':
                    return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>;
                case 'lock':
                    return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>;
                case 'close':
                    return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" /></svg>;
                case 'trophy':
                    return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4a5 5 0 005 5h4a5 5 0 005-5V3M1-1h22v2H1v-2zM5 3H3a2 2 0 00-2 2v2a4 4 0 004 4h1M19 3h2a2 2 0 012 2v2a4 4 0 01-4 4h-1" /></svg>;
                default:
                    return null;
            }
        };

        function App() {
            const [userRole, setUserRole] = useState(() => localStorage.getItem('ture_role') || 'mentor');
            const [pinCode, setPinCode] = useState(() => localStorage.getItem('ture_pin') || '1234');
            const [activeTab, setActiveTab] = useState('eval');
            const [isCloudSynced, setIsCloudSynced] = useState(false);

            const [students, setStudents] = useState(() => {
                const saved = localStorage.getItem('ture_students');
                return saved ? JSON.parse(saved) : INITIAL_STUDENTS;
            });

            const [evaluations, setEvaluations] = useState(() => {
                const saved = localStorage.getItem('ture_evaluations');
                return saved ? JSON.parse(saved) : INITIAL_EVALUATIONS;
            });

            const evalItems = DEFAULT_ITEMS;

            // モーダル State
            const [showPinModal, setShowPinModal] = useState(false);
            const [pinInput, setPinInput] = useState('');
            const [pinError, setPinError] = useState(false);
            const [pendingTab, setPendingTab] = useState(null);

            const [selectedStudentForEval, setSelectedStudentForEval] = useState(null);
            const [selectedStudentForDetail, setSelectedStudentForDetail] = useState(null);
            const [toastMessage, setToastMessage] = useState('');

            // 確認用ダイアログ State
            const [confirmModal, setConfirmModal] = useState({ isOpen: false, title: '', message: '', onConfirm: null });

            useEffect(() => {
                if (!window.FirebaseSync) return;
                const { auth, db, appId, collection, doc, setDoc, onSnapshot, signInWithCustomToken, signInAnonymously, initialAuthToken } = window.FirebaseSync;

                const setupSync = async () => {
                    try {
                        if (initialAuthToken) {
                            await signInWithCustomToken(auth, initialAuthToken);
                        } else {
                            await signInAnonymously(auth);
                        }
                        setIsCloudSynced(true);

                        const studentsRef = collection(db, 'artifacts', appId, 'public', 'data', 'students');
                        const unsubStudents = onSnapshot(studentsRef, (snapshot) => {
                            if (!snapshot.empty) {
                                const list = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                                setStudents(list);
                            } else {
                                INITIAL_STUDENTS.forEach(s => {
                                    setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', s.id), s);
                                });
                            }
                        }, (err) => console.error("Students sync error:", err));

                        const evalsRef = collection(db, 'artifacts', appId, 'public', 'data', 'evaluations');
                        const unsubEvals = onSnapshot(evalsRef, (snapshot) => {
                            const list = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                            list.sort((a, b) => b.id.localeCompare(a.id));
                            setEvaluations(list);
                        }, (err) => console.error("Evaluations sync error:", err));

                        return () => {
                            unsubStudents();
                            unsubEvals();
                        };
                    } catch (e) {
                        console.error("Cloud sync init failed:", e);
                    }
                };

                setupSync();
            }, []);

            useEffect(() => {
                localStorage.setItem('ture_role', userRole);
            }, [userRole]);

            useEffect(() => {
                localStorage.setItem('ture_pin', pinCode);
            }, [pinCode]);

            useEffect(() => {
                localStorage.setItem('ture_students', JSON.stringify(students));
            }, [students]);

            useEffect(() => {
                localStorage.setItem('ture_evaluations', JSON.stringify(evaluations));
            }, [evaluations]);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 2500);
            };

            const handleTabChange = (tab) => {
                if ((tab === 'summary' || tab === 'settings' || tab === 'students') && userRole !== 'admin') {
                    setPendingTab(tab);
                    setShowPinModal(true);
                } else {
                    setActiveTab(tab);
                }
            };

            const handleToggleRole = () => {
                if (userRole === 'admin') {
                    setUserRole('mentor');
                    if (activeTab === 'summary' || activeTab === 'settings' || activeTab === 'students') {
                        setActiveTab('eval');
                    }
                    showToast('メンサポモードに変更しました');
                } else {
                    setPendingTab(null);
                    setShowPinModal(true);
                }
            };

            const handlePinSubmit = (e) => {
                e.preventDefault();
                if (pinInput === pinCode) {
                    setUserRole('admin');
                    setShowPinModal(false);
                    setPinInput('');
                    setPinError(false);
                    showToast('運営モードに切り替えました');
                    if (pendingTab) {
                        setActiveTab(pendingTab);
                        setPendingTab(null);
                    }
                } else {
                    setPinError(true);
                }
            };

            const handleSaveEvaluation = async (newEvalData) => {
                const evalObj = {
                    id: 'e_' + Date.now(),
                    studentId: newEvalData.studentId,
                    evaluatorName: newEvalData.evaluatorName || '匿名メンサポ',
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    scores: newEvalData.scores,
                    comment: newEvalData.comment,
                    tags: newEvalData.tags
                };

                const updated = [evalObj, ...evaluations];
                setEvaluations(updated);

                if (window.FirebaseSync) {
                    try {
                        const { db, appId, doc, setDoc } = window.FirebaseSync;
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'evaluations', evalObj.id), evalObj);
                    } catch (e) {
                        console.error("Cloud save failed:", e);
                    }
                }

                setSelectedStudentForEval(null);
                showToast('記録しました');
            };

            return (
                <div className="max-w-md mx-auto min-h-screen bg-slate-50 flex flex-col justify-between pb-16 relative shadow-xl">
                    {/* Header */}
                    <header className="bg-sky-900 text-white px-3 py-3 sticky top-0 z-30 shadow-md flex items-center justify-between gap-2">
                        <div className="flex items-center gap-1.5 min-w-0">
                            <span className="text-lg flex-shrink-0">⛺</span>
                            <div className="min-w-0 flex items-center gap-1.5">
                                <h1 className="font-extrabold text-sm sm:text-base tracking-tight truncate">
                                    TURE-TECH学生一覧
                                </h1>
                                {isCloudSynced && (
                                    <span className="inline-flex items-center text-[9px] bg-emerald-500/20 text-emerald-300 border border-emerald-400/30 px-1.5 py-0.5 rounded-full flex-shrink-0 whitespace-nowrap">
                                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1 animate-pulse"></span>
                                        同期中
                                    </span>
                                )}
                            </div>
                        </div>

                        <button
                            onClick={handleToggleRole}
                            className={`text-[11px] px-2.5 py-1 rounded-full font-bold shadow-sm transition flex items-center gap-1 flex-shrink-0 border ${
                                userRole === 'admin'
                                    ? 'bg-amber-500 text-white border-amber-300'
                                    : 'bg-sky-800/80 hover:bg-sky-800 text-sky-100 border-sky-400/40'
                            }`}
                        >
                            <span>{userRole === 'admin' ? '🔒 運営' : '👤 メンサポ'}</span>
                            <span className="text-[9px] opacity-75">(切替)</span>
                        </button>
                    </header>

                    {/* Toast Notification */}
                    {toastMessage && (
                        <div className="fixed top-16 left-1/2 transform -translate-x-1/2 z-50 bg-slate-800 text-white px-4 py-2 rounded-full text-xs font-semibold shadow-lg transition-all animate-bounce">
                            ✨ {toastMessage}
                        </div>
                    )}

                    {/* Content Views */}
                    <main className="p-4 flex-1">
                        {activeTab === 'eval' && (
                            <EvalTab
                                students={students}
                                evaluations={evaluations}
                                evalItems={evalItems}
                                onOpenEvalModal={(student) => setSelectedStudentForEval(student)}
                                onOpenDetailModal={(student) => setSelectedStudentForDetail(student)}
                            />
                        )}

                        {activeTab === 'summary' && (
                            <SummaryTab
                                students={students}
                                evaluations={evaluations}
                                evalItems={evalItems}
                                userRole={userRole}
                            />
                        )}

                        {activeTab === 'students' && (
                            <StudentsTab
                                students={students}
                                setStudents={setStudents}
                                showToast={showToast}
                                setConfirmModal={setConfirmModal}
                            />
                        )}

                        {activeTab === 'settings' && (
                            <SettingsTab
                                pinCode={pinCode}
                                setPinCode={setPinCode}
                                evaluations={evaluations}
                                students={students}
                                showToast={showToast}
                            />
                        )}
                    </main>

                    {/* Bottom Navigation */}
                    <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-slate-200 flex justify-around py-2 z-30 shadow-lg">
                        <button
                            onClick={() => handleTabChange('eval')}
                            className={`flex flex-col items-center justify-center w-full py-1 ${activeTab === 'eval' ? 'text-sky-600 font-bold' : 'text-slate-400 font-normal'}`}
                        >
                            <Icon name="pencil" className="w-5 h-5" />
                            <span className="text-[10px] mt-0.5">入力</span>
                        </button>

                        <button
                            onClick={() => handleTabChange('summary')}
                            className={`flex flex-col items-center justify-center w-full py-1 ${activeTab === 'summary' ? 'text-sky-600 font-bold' : 'text-slate-400 font-normal'} relative`}
                        >
                            {userRole !== 'admin' && (
                                <span className="absolute top-0.5 right-3 text-[9px]">🔒</span>
                            )}
                            <Icon name="chart" className="w-5 h-5" />
                            <span className="text-[10px] mt-0.5">集計・推移</span>
                        </button>

                        <button
                            onClick={() => handleTabChange('students')}
                            className={`flex flex-col items-center justify-center w-full py-1 ${activeTab === 'students' ? 'text-sky-600 font-bold' : 'text-slate-400 font-normal'} relative`}
                        >
                            {userRole !== 'admin' && (
                                <span className="absolute top-0.5 right-3 text-[9px]">🔒</span>
                            )}
                            <Icon name="users" className="w-5 h-5" />
                            <span className="text-[10px] mt-0.5">学生管理</span>
                        </button>

                        <button
                            onClick={() => handleTabChange('settings')}
                            className={`flex flex-col items-center justify-center w-full py-1 ${activeTab === 'settings' ? 'text-sky-600 font-bold' : 'text-slate-400 font-normal'} relative`}
                        >
                            {userRole !== 'admin' && (
                                <span className="absolute top-0.5 right-3 text-[9px]">🔒</span>
                            )}
                            <Icon name="settings" className="w-5 h-5" />
                            <span className="text-[10px] mt-0.5">設定</span>
                        </button>
                    </nav>

                    {/* Modals */}
                    {showPinModal && (
                        <PinModal
                            pinInput={pinInput}
                            setPinInput={setPinInput}
                            pinError={pinError}
                            onSubmit={handlePinSubmit}
                            onClose={() => {
                                setShowPinModal(false);
                                setPendingTab(null);
                                setPinError(false);
                            }}
                        />
                    )}

                    {selectedStudentForEval && (
                        <EvalModal
                            student={selectedStudentForEval}
                            evalItems={evalItems}
                            onSave={handleSaveEvaluation}
                            onClose={() => setSelectedStudentForEval(null)}
                        />
                    )}

                    {selectedStudentForDetail && (
                        <DetailModal
                            student={selectedStudentForDetail}
                            evaluations={evaluations.filter(e => e.studentId === selectedStudentForDetail.id)}
                            evalItems={evalItems}
                            userRole={userRole}
                            onClose={() => setSelectedStudentForDetail(null)}
                            onOpenEval={() => {
                                const st = selectedStudentForDetail;
                                setSelectedStudentForDetail(null);
                                setSelectedStudentForEval(st);
                            }}
                        />
                    )}

                    {confirmModal.isOpen && (
                        <ConfirmModal
                            title={confirmModal.title}
                            message={confirmModal.message}
                            onConfirm={() => {
                                confirmModal.onConfirm();
                                setConfirmModal({ isOpen: false, title: '', message: '', onConfirm: null });
                            }}
                            onCancel={() => setConfirmModal({ isOpen: false, title: '', message: '', onConfirm: null })}
                        />
                    )}
                </div>
            );
        }

        function EvalTab({ students, evaluations, evalItems, onOpenEvalModal, onOpenDetailModal }) {
            const [filterGroup, setFilterGroup] = useState('ALL');
            const [searchQuery, setSearchQuery] = useState('');

            const groups = ['ALL', ...new Set(students.map(s => s.group))];

            const filteredStudents = students.filter(student => {
                const matchesGroup = filterGroup === 'ALL' || student.group === filterGroup;
                const matchesSearch = student.name.includes(searchQuery);
                return matchesGroup && matchesSearch;
            });

            return (
                <div className="space-y-4">
                    {/* Filter & Search */}
                    <div className="space-y-2">
                        <div className="flex gap-2 overflow-x-auto pb-1 hide-scrollbar">
                            {groups.map(grp => (
                                <button
                                    key={grp}
                                    onClick={() => setFilterGroup(grp)}
                                    className={`px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition ${
                                        filterGroup === grp
                                            ? 'bg-sky-600 text-white shadow-sm'
                                            : 'bg-white text-slate-600 border border-slate-200'
                                    }`}
                                >
                                    {grp === 'ALL' ? '全班表示' : grp}
                                </button>
                            ))}
                        </div>
                        <input
                            type="text"
                            placeholder="🔍 学生名で検索..."
                            value={searchQuery}
                            onChange={(e) => setSearchQuery(e.target.value)}
                            className="w-full text-xs p-2.5 rounded-xl border border-slate-200 bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-sky-500"
                        />
                    </div>

                    {/* Student List Grid */}
                    <div className="space-y-3">
                        {filteredStudents.length === 0 ? (
                            <p className="text-center text-xs text-slate-400 py-8">該当する学生がいません</p>
                        ) : (
                            filteredStudents.map(student => {
                                const studentEvals = evaluations.filter(e => e.studentId === student.id);
                                const lastEval = studentEvals[0];

                                return (
                                    <div
                                        key={student.id}
                                        className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex flex-col gap-3 transition active:scale-[0.99]"
                                    >
                                        <div className="flex items-center justify-between">
                                            <div
                                                onClick={() => onOpenDetailModal(student)}
                                                className="flex items-center gap-3 cursor-pointer"
                                            >
                                                <div className="w-11 h-11 rounded-full bg-slate-100 flex items-center justify-center text-xl shadow-inner">
                                                    {student.avatar || '🎓'}
                                                </div>
                                                <div>
                                                    <div className="flex items-center gap-2">
                                                        <span className="font-bold text-sm text-slate-800">{student.name}</span>
                                                        <span className="text-[10px] px-2 py-0.5 rounded-md bg-slate-100 font-semibold text-slate-500">
                                                            {student.group}
                                                        </span>
                                                    </div>
                                                    <p className="text-[11px] text-slate-400 mt-0.5">
                                                        入力数: <span className="font-semibold text-sky-600">{studentEvals.length}件</span>
                                                    </p>
                                                </div>
                                            </div>

                                            <button
                                                onClick={() => onOpenEvalModal(student)}

                                            <div
                                                onClick={() => onOpenDetailModal(student)}
                                                className="bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-xs text-slate-600 cursor-pointer space-y-1"
                                            >
                                                <div className="flex justify-between items-center text-[10px] text-slate-400">
                                                    <span>直近メモ ({lastEval.evaluatorName})</span>
                                                    <span>{lastEval.timestamp}</span>
                                                </div>
                                                {lastEval.comment && (
                                                    <p className="line-clamp-1 italic text-slate-700">"{lastEval.comment}"</p>

                                                {lastEval.tags && lastEval.tags.length > 0 && (
                                                    <div className="flex flex-wrap gap-1 pt-1">
                                                        {lastEval.tags.map((t, idx) => (
                                                            <span key={idx} className="text-[9px] bg-sky-100 text-sky-700 px-1.5 py-0.5 rounded-md font-medium">
                                                                {t}
                                                            </span>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                );
                            })
                        )}
                    </div>
                </div>
            );
        }

        function EvalModal({ student, evalItems, onSave, onClose }) {
            const [scores, setScores] = useState({});
            const [comment, setComment] = useState('');
            const [selectedTags, setSelectedTags] = useState([]);
            const [evaluatorName, setEvaluatorName] = useState(() => localStorage.getItem('ture_last_evaluator') || '');

            const handleScoreClick = (item, score) => {
                setScores(prev => {
                    if (prev[item] === score) {
                        const updated = { ...prev };
                        delete updated[item];
                        return updated;
                    } else {
                        return { ...prev, [item]: score };
                    }
                });
            };

            const toggleTag = (tag) => {
                setSelectedTags(prev => 
                    prev.includes(tag) ? prev.filter(t => t !== tag) : [...prev, tag]
                );
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (evaluatorName) {
                    localStorage.setItem('ture_last_evaluator', evaluatorName);
                }
                onSave({
                    studentId: student.id,
                    scores,
                    comment,
                    tags: selectedTags,
                    evaluatorName
                });
            };

            const hasAnyInput = Object.keys(scores).length > 0 || comment.trim() !== '' || selectedTags.length > 0;

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 animate-fade-in">
                    <div className="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl max-h-[90vh] overflow-y-auto p-5 space-y-4 shadow-2xl">
                        <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                            <div className="flex items-center gap-2">
                                <span className="text-2xl">{student.avatar || '🎓'}</span>
                                <div>
                                    <h3 className="font-bold text-base text-slate-800">{student.name} の入力</h3>
                                    <p className="text-[11px] text-slate-400">{student.group} | 1項目からサクサク入力可能</p>
                                </div>
                            </div>
                            <button onClick={onClose} className="p-1 rounded-full text-slate-400 hover:bg-slate-100">
                                <Icon name="close" />
                            </button>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            {/* Evaluation Items */}
                            <div className="space-y-3">
                                <label className="text-xs font-bold text-slate-700 block">
                                    項目 <span className="text-[10px] font-normal text-slate-400">(タップして選択/解除)</span>
                                </label>
                                {evalItems.map(item => (
                                    <div key={item} className="bg-slate-50 p-2.5 rounded-xl border border-slate-100 flex flex-col gap-1.5">
                                        <span className="text-xs font-semibold text-slate-700">{item}</span>
                                        <div className="flex justify-between gap-1">
                                            {[1, 2, 3, 4, 5].map(num => (
                                                <button
                                                    type="button"
                                                    key={num}
                                                    onClick={() => handleScoreClick(item, num)}
                                                    className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition ${
                                                        scores[item] === num
                                                            ? 'bg-amber-400 text-slate-900 shadow-md scale-105'
                                                            : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-100'
                                                    }`}
                                                >
                                                    {num}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {/* Quick Tags */}
                            <div className="space-y-1.5">
                                <label className="text-xs font-bold text-slate-700 block">クイックタグ</label>
                                <div className="flex flex-wrap gap-1.5">
                                    {QUICK_TAGS.map(tag => (
                                        <button
                                            type="button"
                                            key={tag}
                                            onClick={() => toggleTag(tag)}
                                            className={`text-[11px] px-2.5 py-1 rounded-full font-medium transition ${
                                                selectedTags.includes(tag)
                                                    ? 'bg-sky-600 text-white shadow-sm'
                                                    : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                                            }`}
                                        >
                                            {tag}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Comment */}
                            <div className="space-y-1.5">
                                <label className="text-xs font-bold text-slate-700 block">コメント・定性メモ</label>
                                <textarea
                                    rows="2"
                                    placeholder="具体的な行動や発言の良かった点・フィードバック..."
                                    value={comment}
                                    onChange={(e) => setComment(e.target.value)}
                                    className="w-full text-xs p-2.5 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-sky-500"
                                />
                            </div>

                            {/* Evaluator Name */}
                            <div className="space-y-1.5">
                                <label className="text-xs font-bold text-slate-700 block">記入者名 (任意)</label>
                                <input
                                    type="text"
                                    placeholder="例: メンサポ山田"
                                    value={evaluatorName}
                                    onChange={(e) => setEvaluatorName(e.target.value)}
                                    className="w-full text-xs p-2.5 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-sky-500"
                                />
                            </div>

                            {/* Actions */}
                            <div className="pt-2 flex gap-2">
                                <button
                                    type="button"
                                    onClick={onClose}
                                    className="w-1/3 py-2.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-500"
                                >
                                    キャンセル
                                </button>
                                <button
                                    type="submit"
                                    disabled={!hasAnyInput}
                                    className={`w-2/3 py-2.5 rounded-xl text-xs font-bold text-white shadow-md transition ${
                                        hasAnyInput
                                            ? 'bg-sky-600 hover:bg-sky-700'
                                            : 'bg-slate-300 cursor-not-allowed'
                                    }`}
                                >
                                    保存する
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function DetailModal({ student, evaluations, evalItems, userRole, onClose, onOpenEval }) {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            const itemAverages = evalItems.map(item => {
                let sum = 0;
                let count = 0;
                evaluations.forEach(e => {
                    if (e.scores && e.scores[item]) {
                        sum += e.scores[item];
                        count++;
                    }
                });
                return count > 0 ? (sum / count).toFixed(1) : 0;
            });

            useEffect(() => {
                if (userRole === 'admin' && chartRef.current) {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }
                    const ctx = chartRef.current.getContext('2d');
                    chartInstance.current = new Chart(ctx, {
                        type: 'radar',
                        data: {
                            labels: evalItems,
                            datasets: [{
                                label: `${student.name} の平均スコア`,
                                data: itemAverages,
                                backgroundColor: 'rgba(14, 165, 233, 0.2)',
                                borderColor: 'rgba(14, 165, 233, 1)',
                                borderWidth: 2,
                                pointBackgroundColor: 'rgba(14, 165, 233, 1)'
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                r: {
                                    min: 0,
                                    max: 5,
                                    ticks: { stepSize: 1, display: false },
                                    pointLabels: { font: { size: 9, weight: 'bold' } }
                                }
                            },
                            plugins: {
                                legend: { display: false }
                            }
                        }
                    });
                }
                return () => {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }
                };
            }, [userRole, student, evaluations, evalItems]);

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
                    <div className="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl max-h-[90vh] overflow-y-auto p-5 space-y-4 shadow-2xl">
                        <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                            <div className="flex items-center gap-2">
                                <span className="text-2xl">{student.avatar || '🎓'}</span>
                                <div>
                                    <h3 className="font-bold text-base text-slate-800">{student.name} の詳細カルテ</h3>
                                    <p className="text-[11px] text-slate-400">{student.group} | 記録数 {evaluations.length}件</p>
                                </div>
                            </div>
                            <button onClick={onClose} className="p-1 rounded-full text-slate-400 hover:bg-slate-100">
                                <Icon name="close" />
                            </button>
                        </div>

                        {userRole === 'admin' ? (
                            <div className="bg-slate-50 p-3 rounded-2xl border border-slate-100 space-y-2">
                                <h4 className="text-xs font-bold text-slate-700 text-center">能力バランス（レーダー分析）</h4>
                                <div className="h-48 relative">
                                    <canvas ref={chartRef}></canvas>
                                </div>
                            </div>
                        ) : (
                            <div className="bg-amber-50 border border-amber-200 text-amber-800 p-3 rounded-2xl text-xs flex items-center gap-2">
                                <Icon name="lock" className="w-5 h-5 flex-shrink-0 text-amber-600" />
                                <div>
                                    <p className="font-bold">レーダーチャートは非表示です</p>
                                    <p className="text-[10px] text-amber-700 mt-0.5">全体スコアおよびチャート分析は運営モードでのみ閲覧可能です。</p>
                                </div>
                            </div>
                        )}

                        <div className="space-y-2">
                            <h4 className="text-xs font-bold text-slate-700">メモ・入力履歴</h4>
                            {evaluations.length === 0 ? (
                                <p className="text-xs text-slate-400 py-4 text-center">まだ入力がありません</p>
                            ) : (
                                <div className="space-y-2 max-h-48 overflow-y-auto pr-1">
                                    {evaluations.map(e => (
                                        <div key={e.id} className="bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-xs space-y-1">
                                            <div className="flex justify-between items-center text-[10px] text-slate-400">
                                                <span className="font-semibold text-slate-600">{e.evaluatorName}</span>
                                                <span>{e.timestamp}</span>
                                            </div>
                                            {e.comment && <p className="text-slate-700">{e.comment}</p>}
                                            {e.tags && e.tags.length > 0 && (
                                                <div className="flex flex-wrap gap-1 pt-0.5">
                                                    {e.tags.map((t, idx) => (
                                                        <span key={idx} className="text-[9px] bg-sky-100 text-sky-700 px-1.5 py-0.5 rounded-md font-medium">
                                                            {t}
                                                        </span>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        <div className="pt-2">
                            <button
                                onClick={onOpenEval}
                                className="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold text-xs py-2.5 rounded-xl shadow-md transition"
                            >
                                追加入力する
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function SummaryTab({ students, evaluations, userRole }) {
            const [selectedGroup, setSelectedGroup] = useState('ALL');

            const groups = ['ALL', ...new Set(students.map(s => s.group))];

            const studentStats = students.map(student => {
                const evs = evaluations.filter(e => e.studentId === student.id);
                let totalScore = 0;
                let count = 0;

                evs.forEach(e => {
                    if (e.scores) {
                        Object.values(e.scores).forEach(s => {
                            totalScore += s;
                            count++;
                        });
                    }
                });

                const avg = count > 0 ? (totalScore / count) : 0;
                return { ...student, avgScore: avg, evalCount: evs.length };
            });

            const filteredStats = studentStats
                .filter(s => selectedGroup === 'ALL' || s.group === selectedGroup)
                .sort((a, b) => b.avgScore - a.avgScore);

            return (
                <div className="space-y-4">
                    <div className="flex items-center justify-between border-b border-slate-200 pb-2">
                        <h2 className="text-sm font-bold text-slate-800 flex items-center gap-1.5">
                            <Icon name="trophy" className="text-amber-500 w-4 h-4" />
                            <span>集計・MVPランキング</span>
                        </h2>
                        <span className="text-[10px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-bold">🔒 運営専用</span>
                    </div>

                    <div className="flex gap-2 overflow-x-auto pb-1 hide-scrollbar">
                        {groups.map(grp => (
                            <button
                                key={grp}
                                onClick={() => setSelectedGroup(grp)}
                                className={`px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition ${
                                    selectedGroup === grp
                                        ? 'bg-amber-500 text-white shadow-sm'
                                        : 'bg-white text-slate-600 border border-slate-200'
                                }`}
                            >
                                {grp === 'ALL' ? '全チーム' : grp}
                            </button>
                        ))}
                    </div>

                    <div className="space-y-2.5">
                        {filteredStats.map((st, index) => (
                            <div key={st.id} className="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <div className={`w-7 h-7 rounded-full flex items-center justify-center font-bold text-xs ${
                                        index === 0 ? 'bg-amber-400 text-white shadow' :
                                        index === 1 ? 'bg-slate-300 text-slate-800' :
                                        index === 2 ? 'bg-amber-700 text-white' : 'bg-slate-100 text-slate-500'
                                    }`}>
                                        {index + 1}
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <span className="text-xl">{st.avatar}</span>
                                        <div>
                                            <p className="font-bold text-xs text-slate-800">{st.name}</p>
                                            <p className="text-[10px] text-slate-400">{st.group}</p>
                                        </div>
                                    </div>
                                </div>

                                <div className="text-right">
                                    <p className="text-sm font-black text-sky-600">
                                        {st.avgScore > 0 ? st.avgScore.toFixed(2) : '-'} <span className="text-[10px] text-slate-400">点</span>
                                    </p>
                                    <p className="text-[9px] text-slate-400">{st.evalCount}件の評価</p>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function StudentsTab({ students, setStudents, showToast, setConfirmModal }) {
            const [newName, setNewName] = useState('');
            const [newGroup, setNewGroup] = useState('1班');
            const [importMode, setImportMode] = useState('single');
            const [bulkText, setBulkText] = useState('');
            const [defaultBulkGroup, setDefaultBulkGroup] = useState('1班');
            const [isOverwrite, setIsOverwrite] = useState(false);

            const saveStudentToCloud = async (st) => {
                if (window.FirebaseSync) {
                    try {
                        const { db, appId, doc, setDoc } = window.FirebaseSync;
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', st.id), st);
                    } catch (e) {
                        console.error("Cloud save failed:", e);
                    }
                }
            };

            const deleteStudentFromCloud = async (id) => {
                if (window.FirebaseSync) {
                    try {
                        const { db, appId, doc, deleteDoc } = window.FirebaseSync;
                        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', id));
                    } catch (e) {
                        console.error("Cloud delete failed:", e);
                    }
                }
            };

            const handleAddStudent = (e) => {
                e.preventDefault();
                if (!newName.trim()) return;

                const newSt = {
                    id: 'st_' + Date.now(),
                    name: newName.trim(),
                    group: newGroup,
                    avatar: ['👨‍🎓', '👩‍🎓', '🧑‍🎓'][Math.floor(Math.random() * 3)]
                };

                setStudents([...students, newSt]);
                saveStudentToCloud(newSt);
                setNewName('');
                showToast(`${newSt.name} を追加しました`);
            };

            const handleBulkImport = async (e) => {
                e.preventDefault();
                if (!bulkText.trim()) return;

                const lines = bulkText.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
                const parsed = [];

                lines.forEach((line, index) => {
                    let parts = line.split(/[\t,]/).map(p => p.trim());
                    let name = parts[0];
                    let group = parts[1] || defaultBulkGroup;

                    if (name) {
                        name = name.replace(/^["']|["']$/g, '');
                        group = group.replace(/^["']|["']$/g, '');
                        if (group && !group.endsWith('班') && !group.endsWith('チーム') && !isNaN(group)) {
                            group = group + '班';
                        }
                        parsed.push({
                            id: 'st_' + Date.now() + '_' + index,
                            name,
                            group: group || defaultBulkGroup,
                            avatar: ['👨‍🎓', '👩‍🎓', '🧑‍🎓'][Math.floor(Math.random() * 3)]
                        });
                    }
                });

                if (parsed.length === 0) {
                    showToast('有効な学生データが見つかりませんでした');
                    return;
                }

                if (isOverwrite) {
                    setStudents(parsed);
                    if (window.FirebaseSync) {
                        parsed.forEach(st => saveStudentToCloud(st));
                    }
                    showToast(`${parsed.length}名の学生データで全上書きしました`);
                } else {
                    setStudents([...students, ...parsed]);
                    if (window.FirebaseSync) {
                        parsed.forEach(st => saveStudentToCloud(st));
                    }
                    showToast(`${parsed.length}名の学生を一括追加しました`);
                }

                setBulkText('');
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const content = event.target.result;
                    setBulkText(content);
                    showToast('CSVファイルを読み込みました。「一括登録」を実行してください');
                };
                reader.readAsText(file, 'UTF-8');
            };

            const handleDeleteStudent = (id, name) => {
                setConfirmModal({
                    isOpen: true,
                    title: '学生の削除',
                    message: `${name} さんを削除してもよろしいですか？`,
                    onConfirm: () => {
                        setStudents(students.filter(s => s.id !== id));
                        deleteStudentFromCloud(id);
                        showToast(`${name} を削除しました`);
                    }
                });
            };

            const handleClearAll = () => {
                setConfirmModal({
                    isOpen: true,
                    title: '全件削除の確認',
                    message: '登録されているすべての学生データをクリアしてもよろしいですか？',
                    onConfirm: () => {
                        students.forEach(s => deleteStudentFromCloud(s.id));
                        setStudents([]);
                        showToast('全学生データをクリアしました');
                    }
                });
            };

            return (
                <div className="space-y-4">
                    <div className="flex items-center justify-between border-b border-slate-200 pb-2">
                        <h2 className="text-sm font-bold text-slate-800 flex items-center gap-1.5">
                            <Icon name="users" className="text-sky-600 w-4 h-4" />
                            <span>学生・チーム管理</span>
                        </h2>
                        <span className="text-[10px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-bold">🔒 運営専用</span>
                    </div>

                    <div className="flex bg-slate-200 p-1 rounded-xl text-xs font-bold">
                        <button
                            onClick={() => setImportMode('single')}
                            className={`flex-1 py-1.5 rounded-lg transition ${importMode === 'single' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'}`}
                        >
                            ✏️ 1名ずつ登録
                        </button>
                        <button
                            onClick={() => setImportMode('bulk')}
                            className={`flex-1 py-1.5 rounded-lg transition ${importMode === 'bulk' ? 'bg-white text-sky-700 shadow-sm' : 'text-slate-500'}`}
                        >
                            📊 スプレッドシート一括読込
                        </button>
                    </div>

                    {importMode === 'single' ? (
                        <form onSubmit={handleAddStudent} className="bg-white p-3.5 rounded-2xl border border-slate-200 space-y-2.5 shadow-sm">
                            <label className="text-xs font-bold text-slate-700 block">新規学生登録</label>
                            <div className="flex gap-2">
                                <input
                                    type="text"
                                    placeholder="学生氏名"
                                    value={newName}
                                    onChange={(e) => setNewName(e.target.value)}
                                    className="flex-1 text-xs p-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-500"
                                />
                                <select
                                    value={newGroup}
                                    onChange={(e) => setNewGroup(e.target.value)}
                                    className="text-xs p-2 rounded-xl border border-slate-200 bg-white"
                                >
                                    <option value="1班">1班</option>
                                    <option value="2班">2班</option>
                                    <option value="3班">3班</option>
                                    <option value="4班">4班</option>
                                    <option value="5班">5班</option>
                                </select>
                                <button
                                    type="submit"
                                    className="bg-sky-600 hover:bg-sky-700 text-white font-bold text-xs px-3 py-2 rounded-xl shadow transition"
                                >
                                    追加
                                </button>
                            </div>
                        </form>
                    ) : (
                        <form onSubmit={handleBulkImport} className="bg-white p-3.5 rounded-2xl border border-slate-200 space-y-3 shadow-sm">
                            <div>
                                <label className="text-xs font-bold text-slate-700 block">スプレッドシートから貼り付け / CSV読込</label>
                                <p className="text-[10px] text-slate-400 mt-0.5">
                                    Googleスプレッドシートのセル（氏名・班名）を直接コピペするか、CSVファイルを選択してください。
                                </p>
                            </div>

                            <div className="flex items-center justify-between gap-2">
                                <label className="text-[11px] bg-sky-50 text-sky-700 hover:bg-sky-100 border border-sky-200 px-3 py-1.5 rounded-xl cursor-pointer font-bold flex items-center gap-1 transition">
                                    <span>📁 CSVファイルを選択</span>
                                    <input type="file" accept=".csv, .txt" onChange={handleFileUpload} className="hidden" />
                                </label>
                                <div className="flex items-center gap-1">
                                    <span className="text-[10px] text-slate-500">デフォルト:</span>
                                    <select
                                        value={defaultBulkGroup}
                                        onChange={(e) => setDefaultBulkGroup(e.target.value)}
                                        className="text-[10px] p-1 rounded-lg border border-slate-200 bg-white"
                                    >
                                        <option value="1班">1班</option>
                                        <option value="2班">2班</option>
                                        <option value="3班">3班</option>
                                        <option value="4班">4班</option>
                                        <option value="5班">5班</option>
                                    </select>
                                </div>
                            </div>

                            <textarea
                                rows="5"
                                placeholder={`【貼り付け例】\n佐藤 拓海, 1班\n鈴木 葵, 1班\n高橋 健太, 2班`}
                                value={bulkText}
                                onChange={(e) => setBulkText(e.target.value)}
                                className="w-full text-xs p-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white font-mono focus:outline-none focus:ring-2 focus:ring-sky-500"
                            />

                            <div className="flex items-center justify-between pt-1">
                                <label className="flex items-center gap-1.5 text-xs text-slate-600 cursor-pointer">
                                    <input
                                        type="checkbox"
                                        checked={isOverwrite}
                                        onChange={(e) => setIsOverwrite(e.target.checked)}
                                        className="rounded border-slate-300 text-sky-600 focus:ring-sky-500"
                                    />
                                    <span>既存データを上書きする</span>
                                </label>

                                <button
                                    type="submit"
                                    disabled={!bulkText.trim()}
                                    className={`text-xs font-bold px-4 py-2 rounded-xl shadow transition ${
                                        bulkText.trim()
                                            ? 'bg-sky-600 hover:bg-sky-700 text-white'
                                            : 'bg-slate-300 text-white cursor-not-allowed'
                                    }`}
                                >
                                    一括登録を実行
                                </button>
                            </div>
                        </form>
                    )}

                    <div className="space-y-2">
                        <div className="flex items-center justify-between">
                            <label className="text-xs font-bold text-slate-700 block">登録中の学生 ({students.length}名)</label>
                            {students.length > 0 && (
                                <button
                                    onClick={handleClearAll}
                                    className="text-[10px] text-red-500 hover:underline font-semibold"
                                >
                                    全件クリア
                                </button>
                            )}
                        </div>
                        {students.length === 0 ? (
                            <p className="text-center text-xs text-slate-400 py-6 bg-white rounded-2xl border border-slate-100">
                                登録された学生がいません
                            </p>
                        ) : (
                            students.map(s => (
                                <div key={s.id} className="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between">
                                    <div className="flex items-center gap-2">
                                        <span className="text-lg">{s.avatar}</span>
                                        <span className="font-bold text-xs text-slate-800">{s.name}</span>
                                        <span className="text-[10px] px-2 py-0.5 bg-slate-100 text-slate-500 rounded-md font-semibold">{s.group}</span>
                                    </div>
                                    <button
                                        onClick={() => handleDeleteStudent(s.id, s.name)}
                                        className="text-xs text-red-500 hover:bg-red-50 p-1.5 rounded-lg transition"
                                    >
                                        削除
                                    </button>
                                </div>
                            ))
                        )}
                    </div>
                </div>
            );
        }

        function SettingsTab({ pinCode, setPinCode, evaluations, students, showToast }) {
            const [newPin, setNewPin] = useState('');

            const handlePinChange = (e) => {
                e.preventDefault();
                if (newPin.length >= 4) {
                    setPinCode(newPin);
                    setNewPin('');
                    showToast('パスコードを変更しました');
                }
            };

            const handleExportCSV = () => {
                let csvContent = "学生名,チーム,評価者,時間,コメント,タグ,スコア詳細\n";
                evaluations.forEach(e => {
                    const student = students.find(s => s.id === e.studentId);
                    const sName = student ? student.name : '不明';
                    const sGroup = student ? student.group : '不明';
                    const scoresStr = e.scores ? Object.entries(e.scores).map(([k, v]) => `${k}:${v}`).join(';') : '';
                    const tagsStr = e.tags ? e.tags.join(' ') : '';
                    csvContent += `"${sName}","${sGroup}","${e.evaluatorName}","${e.timestamp}","${e.comment || ''}","${tagsStr}","${scoresStr}"\n`;
                });

                const textarea = document.createElement('textarea');
                textarea.value = csvContent;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);

                showToast('評価データをCSVテキストとしてコピーしました！');
            };

            return (
                <div className="space-y-4">
                    <div className="flex items-center justify-between border-b border-slate-200 pb-2">
                        <h2 className="text-sm font-bold text-slate-800 flex items-center gap-1.5">
                            <Icon name="settings" className="text-slate-600 w-4 h-4" />
                            <span>アプリ設定 & データ出力</span>
                        </h2>
                        <span className="text-[10px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-bold">🔒 運営専用</span>
                    </div>

                    <form onSubmit={handlePinChange} className="bg-white p-3.5 rounded-2xl border border-slate-200 space-y-2 shadow-sm">
                        <label className="text-xs font-bold text-slate-700 block">運営用パスコード変更 (現在: {pinCode})</label>
                        <div className="flex gap-2">
                            <input
                                type="password"
                                maxLength="6"
                                placeholder="新しいパスコード (4桁以上)"
                                value={newPin}
                                onChange={(e) => setNewPin(e.target.value)}
                                className="flex-1 text-xs p-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-500"
                            />
                            <button
                                type="submit"
                                className="bg-slate-800 text-white font-bold text-xs px-3 py-2 rounded-xl shadow hover:bg-slate-900 transition"
                            >
                                更新
                            </button>
                        </div>
                    </form>

                    <div className="bg-white p-3.5 rounded-2xl border border-slate-200 space-y-2 shadow-sm">
                        <label className="text-xs font-bold text-slate-700 block">評価データの書き出し</label>
                        <p className="text-[11px] text-slate-500">蓄積されたすべての評価レコードをコピーし、スプレッドシートやExcelに直接貼り付けられます。</p>
                        <button
                            onClick={handleExportCSV}
                            className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-2.5 rounded-xl shadow transition flex items-center justify-center gap-1.5"
                        >
                            <span>📋 評価データをクリップボードにコピー</span>
                        </button>
                    </div>
                </div>
            );
        }

        function PinModal({ pinInput, setPinInput, pinError, onSubmit, onClose }) {
            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div className="bg-white w-full max-w-xs rounded-3xl p-5 space-y-4 shadow-2xl text-center">
                        <div className="w-12 h-12 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto text-xl">
                            🔒
                        </div>
                        <div>
                            <h3 className="font-bold text-sm text-slate-800">運営用パスコード認証</h3>
                            <p className="text-[11px] text-slate-400 mt-1">パスコードを入力してください</p>
                        </div>

                        <form onSubmit={onSubmit} className="space-y-3">
                            <input
                                type="password"
                                maxLength="6"
                                autoFocus
                                placeholder="パスコードを入力"
                                value={pinInput}
                                onChange={(e) => setPinInput(e.target.value)}
                                className={`w-full text-center tracking-widest text-lg font-bold p-2.5 rounded-xl border ${
                                    pinError ? 'border-red-500 bg-red-50' : 'border-slate-200'
                                } focus:outline-none focus:ring-2 focus:ring-amber-500`}
                            />
                            {pinError && <p className="text-[10px] text-red-500 font-bold">パスコードが正しくありません</p>}

                            <div className="flex gap-2">
                                <button
                                    type="button"
                                    onClick={onClose}
                                    className="w-1/2 py-2 rounded-xl border border-slate-200 text-xs font-bold text-slate-500"
                                >
                                    戻る
                                </button>
                                <button
                                    type="submit"
                                    className="w-1/2 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold shadow"
                                >
                                    認証
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function ConfirmModal({ title, message, onConfirm, onCancel }) {
            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div className="bg-white w-full max-w-xs rounded-3xl p-5 space-y-4 shadow-2xl text-center">
                        <div>
                            <h3 className="font-bold text-sm text-slate-800">{title}</h3>
                            <p className="text-xs text-slate-500 mt-2">{message}</p>
                        </div>
                        <div className="flex gap-2 pt-2">
                            <button
                                onClick={onCancel}
                                className="w-1/2 py-2 rounded-xl border border-slate-200 text-xs font-bold text-slate-500"
                            >
                                キャンセル
                            </button>
                            <button
                                onClick={onConfirm}
                                className="w-1/2 py-2 rounded-xl bg-red-500 hover:bg-red-600 text-white text-xs font-bold shadow"
                            >
                                実行する
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        window.onload = function() {
            const rootElement = document.getElementById('root');
            const root = ReactDOM.createRoot(rootElement);
            root.render(<App />);
        };
    </script>
</body>
</html>
