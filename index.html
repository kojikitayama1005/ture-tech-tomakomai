<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TURE-TECH 学生評価・カルテ管理</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS for Excel export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .tab-active { border-bottom: 3px solid #2563eb; color: #2563eb; font-weight: 700; }
        .score-badge { transition: all 0.2s ease; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-16">

    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-2 rounded-lg font-bold text-lg">TT</div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">TURE-TECH 評価・カルテ</h1>
                    <p class="text-xs text-slate-400">学生評価 & 時系列カルテ管理システム</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <span id="syncStatus" class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                    <span class="w-2 h-2 mr-1.5 bg-emerald-400 rounded-full animate-pulse"></span>
                    データ保存中
                </span>
            </div>
        </div>
        
        <!-- Navigation Tabs -->
        <nav class="bg-white border-b border-slate-200 text-slate-600 text-sm font-medium">
            <div class="max-w-6xl mx-auto px-4 flex space-x-8">
                <button onclick="switchTab('list')" id="tab-list" class="py-3 px-1 tab-active flex items-center space-x-2">
                    <i class="fa-solid fa-users text-base"></i>
                    <span>学生一覧・入力</span>
                </button>
                <button onclick="switchTab('analytics')" id="tab-analytics" class="py-3 px-1 flex items-center space-x-2">
                    <i class="fa-solid fa-chart-line text-base"></i>
                    <span>集計・推移</span>
                </button>
            </div>
        </nav>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6">

        <!-- TAB 1: 学生一覧 & 入力一体化画面 -->
        <section id="view-list" class="space-y-6">
            <!-- Search & Team Filters -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"></i>
                    <input type="text" id="searchInput" oninput="renderStudents()" placeholder="学生名・フリガナで検索..." 
                           class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="flex items-center space-x-1 overflow-x-auto pb-1 md:pb-0" id="teamFilterButtons">
                    <!-- Dynamic Team Filter Buttons -->
                </div>
            </div>

            <!-- Student Summary Cards Grid -->
            <div id="studentGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Dynamic Student Cards -->
            </div>
        </section>

        <!-- TAB 2: 集計・推移画面 -->
        <section id="view-analytics" class="space-y-6 hidden">
            <!-- Analytics Header / Excel Button -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div>
                    <h2 class="text-lg font-bold text-slate-800">評価分析 & 時系列推移</h2>
                    <p class="text-xs text-slate-500">入力ごとの5項目スコア推移を個別グラフで分析できます</p>
                </div>
                <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2 rounded-lg text-sm shadow-sm flex items-center space-x-2 transition">
                    <i class="fa-solid fa-file-excel text-base"></i>
                    <span>Excel出力 (.xlsx)</span>
                </button>
            </div>

            <!-- Student Selector for Detailed Trend -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-100 pb-4">
                    <label class="text-sm font-bold text-slate-700 flex items-center space-x-2">
                        <i class="fa-solid fa-user-gear text-blue-600"></i>
                        <span>対象学生のスコア推移（5項目個別）:</span>
                    </label>
                    <select id="analyticsStudentSelect" onchange="renderIndividualTrendChart()" class="bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <!-- Dynamic Student Options -->
                    </select>
                </div>

                <!-- 5-Item Multi-Line Chart Container -->
                <div class="relative w-full h-80 bg-slate-50/50 p-2 rounded-lg border border-slate-100">
                    <canvas id="individualTrendChart"></canvas>
                </div>
            </div>

            <!-- Evaluation History Log Table -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                    <h3 class="font-bold text-slate-800 text-sm flex items-center space-x-2">
                        <i class="fa-solid fa-list-check text-slate-600"></i>
                        <span>全入力履歴ログ</span>
                    </h3>
                    <span id="logCountBadge" class="text-xs font-semibold bg-blue-100 text-blue-800 px-2.5 py-0.5 rounded-full">0件</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-slate-100 text-slate-600 font-semibold border-b border-slate-200">
                            <tr>
                                <th class="p-3">日時</th>
                                <th class="p-3">対象学生</th>
                                <th class="p-3">チーム</th>
                                <th class="p-3">記入者</th>
                                <th class="p-3 text-center">論点</th>
                                <th class="p-3 text-center">課題</th>
                                <th class="p-3 text-center">根拠</th>
                                <th class="p-3 text-center">巻き込み</th>
                                <th class="p-3 text-center">他者尊重</th>
                                <th class="p-3">所感メモ</th>
                                <th class="p-3 text-center">操作</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody" class="divide-y divide-slate-100 text-slate-700">
                            <!-- Dynamic History Rows -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <!-- MODAL 1: 評価入力モーダル -->
    <div id="evalModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-xl max-w-lg w-full max-h-[90vh] overflow-y-auto border border-slate-200">
            <!-- Modal Header -->
            <div class="p-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center sticky top-0 z-10">
                <div>
                    <span id="modalTeamBadge" class="inline-block text-[10px] font-bold px-2 py-0.5 rounded bg-blue-100 text-blue-800 mb-1">Aチーム</span>
                    <h3 id="modalStudentName" class="text-lg font-bold text-slate-800">山田 太郎</h3>
                </div>
                <button onclick="closeEvalModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Modal Form Body -->
            <div class="p-5 space-y-5">
                <!-- 記入者情報 (必須) -->
                <div class="bg-blue-50/60 p-3.5 rounded-xl border border-blue-100 space-y-3">
                    <label class="block text-xs font-bold text-slate-700">
                        記入者情報 <span class="text-rose-500">*必須</span>
                    </label>
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" id="roleMentorBtn" onclick="setEvaluatorRole('メンター')" 
                                class="py-2 text-xs font-bold rounded-lg border text-center transition bg-blue-600 text-white border-blue-600 shadow-sm">
                            👨‍🏫 メンター
                        </button>
                        <button type="button" id="roleSupporterBtn" onclick="setEvaluatorRole('サポーター')" 
                                class="py-2 text-xs font-bold rounded-lg border text-center transition bg-white text-slate-600 border-slate-300">
                            🤝 サポーター
                        </button>
                    </div>
                    <input type="text" id="evaluatorNameInput" oninput="validateModalForm()" placeholder="記入者の氏名を入力してください（例: 鈴木）" 
                           class="w-full text-xs p-2.5 bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- 5 Criteria Ratings -->
                <div class="space-y-4">
                    <h4 class="text-xs font-bold text-slate-700 border-b border-slate-100 pb-1">評価スコア (1〜5点)</h4>

                    <!-- 1. 論点整理・前提理解 -->
                    <div class="space-y-1">
                        <div class="flex justify-between items-center text-xs">
                            <span class="font-semibold text-slate-700">1. 論点整理・前提理解</span>
                            <span id="val_c1" class="font-bold text-blue-600">3点</span>
                        </div>
                        <input type="range" id="score_c1" min="1" max="5" value="3" oninput="updateScoreDisplay('c1')" class="w-full accent-blue-600">
                    </div>

                    <!-- 2. 課題特定 -->
                    <div class="space-y-1">
                        <div class="flex justify-between items-center text-xs">
                            <span class="font-semibold text-slate-700">2. 課題特定</span>
                            <span id="val_c2" class="font-bold text-blue-600">3点</span>
                        </div>
                        <input type="range" id="score_c2" min="1" max="5" value="3" oninput="updateScoreDisplay('c2')" class="w-full accent-blue-600">
                    </div>

                    <!-- 3. 根拠・論拠の明確さ -->
                    <div class="space-y-1">
                        <div class="flex justify-between items-center text-xs">
                            <span class="font-semibold text-slate-700">3. 根拠・論拠の明確さ</span>
                            <span id="val_c3" class="font-bold text-blue-600">3点</span>
                        </div>
                        <input type="range" id="score_c3" min="1" max="5" value="3" oninput="updateScoreDisplay('c3')" class="w-full accent-blue-600">
                    </div>

                    <!-- 4. 巻き込み・合意形成 -->
                    <div class="space-y-1">
                        <div class="flex justify-between items-center text-xs">
                            <span class="font-semibold text-slate-700">4. 巻き込み・合意形成</span>
                            <span id="val_c4" class="font-bold text-blue-600">3点</span>
                        </div>
                        <input type="range" id="score_c4" min="1" max="5" value="3" oninput="updateScoreDisplay('c4')" class="w-full accent-blue-600">
                    </div>

                    <!-- 5. 他者尊重 -->
                    <div class="space-y-1">
                        <div class="flex justify-between items-center text-xs">
                            <span class="font-semibold text-slate-700">5. 他者尊重</span>
                            <span id="val_c5" class="font-bold text-blue-600">3点</span>
                        </div>
                        <input type="range" id="score_c5" min="1" max="5" value="3" oninput="updateScoreDisplay('c5')" class="w-full accent-blue-600">
                    </div>
                </div>

                <!-- 定性メモ / 所感 (必須) -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-bold text-slate-700">
                        定性メモ・所感 <span class="text-rose-500">*必須</span>
                    </label>
                    <textarea id="commentInput" rows="3" oninput="validateModalForm()" 
                              placeholder="各学生の所感を入力してください" 
                              class="w-full text-xs p-3 bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="p-4 border-t border-slate-100 bg-slate-50 flex justify-end space-x-3">
                <button onclick="closeEvalModal()" class="px-4 py-2 text-xs font-medium text-slate-600 hover:text-slate-800 bg-slate-200 rounded-lg">キャンセル</button>
                <button id="saveEvalBtn" onclick="saveEvaluation()" disabled 
                        class="px-5 py-2 text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed rounded-lg shadow-sm transition">
                    保存する
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL 2: 学生詳細カルテモーダル -->
    <div id="karteModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto border border-slate-200">
            <div class="p-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center sticky top-0 z-10">
                <div>
                    <span id="karteTeamBadge" class="inline-block text-[10px] font-bold px-2 py-0.5 rounded bg-blue-100 text-blue-800 mb-1">Aチーム</span>
                    <h3 id="karteStudentName" class="text-lg font-bold text-slate-800">山田 太郎 カルテ</h3>
                </div>
                <button onclick="closeKarteModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="p-5 space-y-6">
                <!-- Individual Trend Chart -->
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2">
                    <h4 class="text-xs font-bold text-slate-700 flex items-center space-x-2">
                        <i class="fa-solid fa-chart-line text-blue-600"></i>
                        <span>5項目スコア推移（全データタイムスタンプ）</span>
                    </h4>
                    <div class="relative w-full h-64 bg-white p-2 rounded-lg border border-slate-100">
                        <canvas id="karteTrendChart"></canvas>
                    </div>
                </div>

                <!-- History Logs for Student -->
                <div class="space-y-3">
                    <h4 class="text-xs font-bold text-slate-700 border-b border-slate-100 pb-2">過去の評価・所感履歴</h4>
                    <div id="karteHistoryList" class="space-y-3">
                        <!-- Dynamic History Cards -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Default Students Data (30 Students)
        const DEFAULT_STUDENTS = [
            // Aチーム (6名)
            { id: "s1", name: "洪 克樹", group: "Aチーム", kana: "ホン カツキ" },
            { id: "s2", name: "平川 凛乃丞", group: "Aチーム", kana: "ヒラカワ リノスケ" },
            { id: "s3", name: "吉田 光里", group: "Aチーム", kana: "ヨシダ ヒカリ" },
            { id: "s4", name: "前田 悠翔", group: "Aチーム", kana: "マエダ ハルト" },
            { id: "s5", name: "田上 睦己", group: "Aチーム", kana: "タガミ ムツミ" },
            { id: "s6", name: "関口 実桜", group: "Aチーム", kana: "セキグチ ミオ" },
            // Bチーム (6名)
            { id: "s7", name: "田邉 莉那", group: "Bチーム", kana: "タナベ リナ" },
            { id: "s8", name: "藤田 彩翔", group: "Bチーム", kana: "フジタ アヤト" },
            { id: "s9", name: "大島 史菜", group: "Bチーム", kana: "オオシマ フミナ" },
            { id: "s10", name: "堀田 壮真", group: "Bチーム", kana: "ホッタ ソウマ" },
            { id: "s11", name: "坂本 愛緒", group: "Bチーム", kana: "サカモト アオ" },
            { id: "s12", name: "神田 結生", group: "Bチーム", kana: "カンダ ユウ" },
            // Cチーム (5名 - 唯木 瞬 除外済み)
            { id: "s13", name: "岩﨑 美怜", group: "Cチーム", kana: "イワサキ ミレイ" },
            { id: "s14", name: "飯塚 成大", group: "Cチーム", kana: "イイヅカ セイダイ" },
            { id: "s15", name: "西松 和郎", group: "Cチーム", kana: "ニシマツ カオ" },
            { id: "s17", name: "加藤 青", group: "Cチーム", kana: "カトウ アオ" },
            { id: "s18", name: "河崎 みの里", group: "Cチーム", kana: "カワサキ ミノリ" },
            // Dチーム (6名)
            { id: "s19", name: "川名 桜慈", group: "Dチーム", kana: "カワナ オウジ" },
            { id: "s20", name: "堀部 紗礼", group: "Dチーム", kana: "ホリベ サラ" },
            { id: "s21", name: "畑中 真彦", group: "Dチーム", kana: "ハタナカ マサヒコ" },
            { id: "s22", name: "大久保 佳奈", group: "Dチーム", kana: "オオクボ カナ" },
            { id: "s23", name: "向井 和輝", group: "Dチーム", kana: "ムカイ カズキ" },
            { id: "s24", name: "尾形 瑞希", group: "Dチーム", kana: "オガタ ミズキ" },
            // Eチーム (7名)
            { id: "s25", name: "保坂 海", group: "Eチーム", kana: "ホサカ カイ" },
            { id: "s26", name: "中嶋 大貴", group: "Eチーム", kana: "ナカジマ ダイキ" },
            { id: "s27", name: "山口 真季", group: "Eチーム", kana: "ヤマグチ マキ" },
            { id: "s28", name: "仲田 万智子", group: "Eチーム", kana: "ナカダ マチコ" },
            { id: "s29", name: "大原 明", group: "Eチーム", kana: "オオハラ アキラ" },
            { id: "s30", name: "保科 りさ子", group: "Eチーム", kana: "ホシナ リサコ" },
            { id: "s31", name: "米田 遥希", group: "Eチーム", kana: "ヨネダ ハルキ" }
        ];

        // Storage Keys
        const STORAGE_STUDENTS = 'turetech_students_v11';
        const STORAGE_EVALS = 'turetech_evals_v11';
        const STORAGE_EVALUATOR_ROLE = 'turetech_evaluator_role';
        const STORAGE_EVALUATOR_NAME = 'turetech_evaluator_name';

        // State Variables
        let students = [];
        let evaluations = [];
        let selectedTeamFilter = 'ALL';
        let currentStudentForModal = null;
        let currentEvaluatorRole = 'メンター';

        // Chart Instances
        let analyticsChartInstance = null;
        let karteChartInstance = null;

        // Initialization
        window.addEventListener('DOMContentLoaded', () => {
            loadLocalData();
            renderTeamFilterButtons();
            renderStudents();
            populateStudentDropdowns();
            
            // Restore Evaluator name/role
            const savedRole = localStorage.getItem(STORAGE_EVALUATOR_ROLE);
            if (savedRole) setEvaluatorRole(savedRole);
            const savedName = localStorage.getItem(STORAGE_EVALUATOR_NAME);
            if (savedName) document.getElementById('evaluatorNameInput').value = savedName;
        });

        // Load / Save Functions
        function loadLocalData() {
            const savedStudents = localStorage.getItem(STORAGE_STUDENTS);
            if (savedStudents) {
                try { students = JSON.parse(savedStudents); } catch (e) { students = [...DEFAULT_STUDENTS]; }
            } else {
                students = [...DEFAULT_STUDENTS];
                localStorage.setItem(STORAGE_STUDENTS, JSON.stringify(students));
            }

            const savedEvals = localStorage.getItem(STORAGE_EVALS);
            if (savedEvals) {
                try { evaluations = JSON.parse(savedEvals); } catch (e) { evaluations = []; }
            } else {
                evaluations = [];
            }
        }

        function saveData() {
            localStorage.setItem(STORAGE_STUDENTS, JSON.stringify(students));
            localStorage.setItem(STORAGE_EVALS, JSON.stringify(evaluations));
        }

        // Tab Switching Logic
        function switchTab(tabName) {
            ['list', 'analytics'].forEach(t => {
                document.getElementById(`view-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).classList.remove('tab-active');
            });
            document.getElementById(`view-${tabName}`).classList.remove('hidden');
            document.getElementById(`tab-${tabName}`).classList.add('tab-active');

            if (tabName === 'analytics') {
                renderIndividualTrendChart();
                renderHistoryTable();
            }
        }

        // Team Filter Buttons
        function renderTeamFilterButtons() {
            const teams = ['ALL', 'Aチーム', 'Bチーム', 'Cチーム', 'Dチーム', 'Eチーム'];
            const container = document.getElementById('teamFilterButtons');
            container.innerHTML = teams.map(t => `
                <button onclick="setTeamFilter('${t}')" class="px-3 py-1.5 text-xs font-semibold rounded-lg transition ${selectedTeamFilter === t ? 'bg-blue-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                    ${t === 'ALL' ? '全チーム' : t}
                </button>
            `).join('');
        }

        function setTeamFilter(team) {
            selectedTeamFilter = team;
            renderTeamFilterButtons();
            renderStudents();
        }

        // Render Student Cards Grid
        function renderStudents() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const grid = document.getElementById('studentGrid');

            const filtered = students.filter(s => {
                const matchesTeam = (selectedTeamFilter === 'ALL' || s.group === selectedTeamFilter);
                const matchesSearch = s.name.toLowerCase().includes(query) || s.kana.toLowerCase().includes(query);
                return matchesTeam && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 text-sm">該当する学生が見つかりません</div>`;
                return;
            }

            grid.innerHTML = filtered.map(s => {
                const studentEvals = evaluations.filter(e => e.studentId === s.id);
                const count = studentEvals.length;
                let lastScore = '-';
                let lastTime = '未入力';

                if (count > 0) {
                    const latest = studentEvals[studentEvals.length - 1];
                    const scores = Object.values(latest.scores);
                    const avg = (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1);
                    lastScore = `${avg}点`;
                    lastTime = new Date(latest.timestamp).toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                }

                return `
                    <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 flex flex-col justify-between space-y-3 hover:border-blue-300 transition">
                        <div>
                            <div class="flex justify-between items-start">
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-600 border border-slate-200">${s.group}</span>
                                <span class="text-[11px] text-slate-400 font-medium"><i class="fa-solid fa-clock-rotate-left mr-1"></i>${lastTime}</span>
                            </div>
                            <h3 class="font-bold text-slate-800 text-base mt-1">${s.name}</h3>
                            <p class="text-[10px] text-slate-400">${s.kana}</p>
                        </div>

                        <div class="bg-slate-50 p-2.5 rounded-lg flex justify-between items-center text-xs">
                            <span class="text-slate-500">入力回数: <strong class="text-slate-800">${count}回</strong></span>
                            <span class="text-slate-500">直近平均: <strong class="text-blue-600 font-bold">${lastScore}</strong></span>
                        </div>

                        <div class="grid grid-cols-2 gap-2 pt-1">
                            <button onclick="openEvalModal('${s.id}')" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg text-xs shadow-sm flex items-center justify-center space-x-1 transition">
                                <i class="fa-solid fa-pen-to-square"></i>
                                <span>入力</span>
                            </button>
                            <button onclick="openKarteModal('${s.id}')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2 rounded-lg text-xs flex items-center justify-center space-x-1 transition">
                                <i class="fa-solid fa-chart-line text-blue-600"></i>
                                <span>カルテ</span>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Modal Form Controls & Validation
        function openEvalModal(studentId) {
            currentStudentForModal = students.find(s => s.id === studentId);
            if (!currentStudentForModal) return;

            document.getElementById('modalTeamBadge').textContent = currentStudentForModal.group;
            document.getElementById('modalStudentName').textContent = currentStudentForModal.name;

            // Reset scores
            ['c1', 'c2', 'c3', 'c4', 'c5'].forEach(c => {
                document.getElementById(`score_${c}`).value = 3;
                document.getElementById(`val_${c}`).textContent = '3点';
            });

            document.getElementById('commentInput').value = '';
            validateModalForm();

            document.getElementById('evalModal').classList.remove('hidden');
        }

        function closeEvalModal() {
            document.getElementById('evalModal').classList.add('hidden');
            currentStudentForModal = null;
        }

        function setEvaluatorRole(role) {
            currentEvaluatorRole = role;
            localStorage.setItem(STORAGE_EVALUATOR_ROLE, role);
            
            const mentorBtn = document.getElementById('roleMentorBtn');
            const supporterBtn = document.getElementById('roleSupporterBtn');

            if (role === 'メンター') {
                mentorBtn.className = "py-2 text-xs font-bold rounded-lg border text-center transition bg-blue-600 text-white border-blue-600 shadow-sm";
                supporterBtn.className = "py-2 text-xs font-bold rounded-lg border text-center transition bg-white text-slate-600 border-slate-300";
            } else {
                mentorBtn.className = "py-2 text-xs font-bold rounded-lg border text-center transition bg-white text-slate-600 border-slate-300";
                supporterBtn.className = "py-2 text-xs font-bold rounded-lg border text-center transition bg-blue-600 text-white border-blue-600 shadow-sm";
            }
        }

        function updateScoreDisplay(key) {
            const val = document.getElementById(`score_${key}`).value;
            document.getElementById(`val_${key}`).textContent = `${val}点`;
        }

        function validateModalForm() {
            const evalName = document.getElementById('evaluatorNameInput').value.trim();
            const comment = document.getElementById('commentInput').value.trim();
            const saveBtn = document.getElementById('saveEvalBtn');

            if (evalName.length > 0 && comment.length > 0) {
                saveBtn.disabled = false;
            } else {
                saveBtn.disabled = true;
            }
        }

        function saveEvaluation() {
            if (!currentStudentForModal) return;

            const evalName = document.getElementById('evaluatorNameInput').value.trim();
            const comment = document.getElementById('commentInput').value.trim();

            if (!evalName || !comment) return;

            localStorage.setItem(STORAGE_EVALUATOR_NAME, evalName);

            const record = {
                id: 'eval_' + Date.now(),
                studentId: currentStudentForModal.id,
                studentName: currentStudentForModal.name,
                group: currentStudentForModal.group,
                evaluatorRole: currentEvaluatorRole,
                evaluatorName: evalName,
                timestamp: new Date().toISOString(),
                scores: {
                    c1: parseInt(document.getElementById('score_c1').value, 10),
                    c2: parseInt(document.getElementById('score_c2').value, 10),
                    c3: parseInt(document.getElementById('score_c3').value, 10),
                    c4: parseInt(document.getElementById('score_c4').value, 10),
                    c5: parseInt(document.getElementById('score_c5').value, 10)
                },
                comment: comment
            };

            evaluations.push(record);
            saveData();
            closeEvalModal();
            renderStudents();
            populateStudentDropdowns();

            // Flash success state
            const syncStatus = document.getElementById('syncStatus');
            syncStatus.className = "inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-blue-500/30 text-white border border-blue-400";
            syncStatus.innerHTML = `<i class="fa-solid fa-check mr-1 text-emerald-400"></i> 保存完了`;
            setTimeout(() => {
                syncStatus.className = "inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
                syncStatus.innerHTML = `<span class="w-2 h-2 mr-1.5 bg-emerald-400 rounded-full animate-pulse"></span> データ保存中`;
            }, 2000);
        }

        // Student Dropdowns Setup
        function populateStudentDropdowns() {
            const select = document.getElementById('analyticsStudentSelect');
            select.innerHTML = students.map(s => `<option value="${s.id}">${s.group} - ${s.name}</option>`).join('');
        }

        // Render 5-Item Line Chart for Selected Student
        function renderIndividualTrendChart() {
            const studentId = document.getElementById('analyticsStudentSelect').value || (students[0] && students[0].id);
            if (!studentId) return;

            const studentEvals = evaluations
                .filter(e => e.studentId === studentId)
                .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

            const ctx = document.getElementById('individualTrendChart').getContext('2d');

            if (analyticsChartInstance) {
                analyticsChartInstance.destroy();
            }

            const labels = studentEvals.map((e, idx) => {
                const d = new Date(e.timestamp);
                return `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')} (${e.evaluatorName})`;
            });

            // 5 Criteria Datasets
            const datasets = [
                {
                    label: '1. 論点整理・前提理解',
                    data: studentEvals.map(e => e.scores.c1),
                    borderColor: '#2563eb', // Blue
                    backgroundColor: '#2563eb',
                    tension: 0.2
                },
                {
                    label: '2. 課題特定',
                    data: studentEvals.map(e => e.scores.c2),
                    borderColor: '#059669', // Emerald Green
                    backgroundColor: '#059669',
                    tension: 0.2
                },
                {
                    label: '3. 根拠・論拠の明確さ',
                    data: studentEvals.map(e => e.scores.c3),
                    borderColor: '#d97706', // Amber/Yellow
                    backgroundColor: '#d97706',
                    tension: 0.2
                },
                {
                    label: '4. 巻き込み・合意形成',
                    data: studentEvals.map(e => e.scores.c4),
                    borderColor: '#7c3aed', // Purple
                    backgroundColor: '#7c3aed',
                    tension: 0.2
                },
                {
                    label: '5. 他者尊重',
                    data: studentEvals.map(e => e.scores.c5),
                    borderColor: '#e11d48', // Rose Red
                    backgroundColor: '#e11d48',
                    tension: 0.2
                }
            ];

            analyticsChartInstance = new Chart(ctx, {
                type: 'line',
                data: { labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { min: 1, max: 5, ticks: { stepSize: 1 } }
                    },
                    plugins: {
                        legend: { position: 'top', labels: { boxWidth: 12, font: { size: 10 } } }
                    }
                }
            });
        }

        // Render Individual Karte Modal
        function openKarteModal(studentId) {
            const student = students.find(s => s.id === studentId);
            if (!student) return;

            document.getElementById('karteTeamBadge').textContent = student.group;
            document.getElementById('karteStudentName').textContent = `${student.name} カルテ`;

            const studentEvals = evaluations
                .filter(e => e.studentId === studentId)
                .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

            // Render Karte Chart
            const ctx = document.getElementById('karteTrendChart').getContext('2d');
            if (karteChartInstance) {
                karteChartInstance.destroy();
            }

            const labels = studentEvals.map((e, idx) => {
                const d = new Date(e.timestamp);
                return `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
            });

            karteChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        { label: '論点整理', data: studentEvals.map(e => e.scores.c1), borderColor: '#2563eb', backgroundColor: '#2563eb' },
                        { label: '課題特定', data: studentEvals.map(e => e.scores.c2), borderColor: '#059669', backgroundColor: '#059669' },
                        { label: '根拠・論拠', data: studentEvals.map(e => e.scores.c3), borderColor: '#d97706', backgroundColor: '#d97706' },
                        { label: '巻き込み', data: studentEvals.map(e => e.scores.c4), borderColor: '#7c3aed', backgroundColor: '#7c3aed' },
                        { label: '他者尊重', data: studentEvals.map(e => e.scores.c5), borderColor: '#e11d48', backgroundColor: '#e11d48' }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { min: 1, max: 5, ticks: { stepSize: 1 } } },
                    plugins: { legend: { position: 'top', labels: { boxWidth: 10, font: { size: 9 } } } }
                }
            });

            // History Cards
            const historyList = document.getElementById('karteHistoryList');
            if (studentEvals.length === 0) {
                historyList.innerHTML = `<p class="text-xs text-slate-400 py-4 text-center">まだ入力履歴がありません</p>`;
            } else {
                historyList.innerHTML = studentEvals.slice().reverse().map(e => {
                    const dateStr = new Date(e.timestamp).toLocaleString('ja-JP');
                    return `
                        <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 text-xs space-y-2">
                            <div class="flex justify-between text-slate-500 font-medium">
                                <span><i class="fa-solid fa-user-pen mr-1"></i>[${e.evaluatorRole}] ${e.evaluatorName}</span>
                                <span>${dateStr}</span>
                            </div>
                            <div class="flex space-x-2 text-[10px] font-bold">
                                <span class="bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded">論点:${e.scores.c1}</span>
                                <span class="bg-emerald-100 text-emerald-800 px-1.5 py-0.5 rounded">課題:${e.scores.c2}</span>
                                <span class="bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded">根拠:${e.scores.c3}</span>
                                <span class="bg-purple-100 text-purple-800 px-1.5 py-0.5 rounded">巻込:${e.scores.c4}</span>
                                <span class="bg-rose-100 text-rose-800 px-1.5 py-0.5 rounded">尊重:${e.scores.c5}</span>
                            </div>
                            <p class="text-slate-700 bg-white p-2 rounded border border-slate-100 whitespace-pre-wrap">${e.comment}</p>
                        </div>
                    `;
                }).join('');
            }

            document.getElementById('karteModal').classList.remove('hidden');
        }

        function closeKarteModal() {
            document.getElementById('karteModal').classList.add('hidden');
        }

        // History Log Table Render
        function renderHistoryTable() {
            const tbody = document.getElementById('historyTableBody');
            document.getElementById('logCountBadge').textContent = `${evaluations.length}件`;

            if (evaluations.length === 0) {
                tbody.innerHTML = `<tr><td colspan="11" class="p-6 text-center text-slate-400">入力データが存在しません</td></tr>`;
                return;
            }

            const sorted = evaluations.slice().sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

            tbody.innerHTML = sorted.map(e => {
                const dateStr = new Date(e.timestamp).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                return `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-3 text-slate-500 font-mono">${dateStr}</td>
                        <td class="p-3 font-bold text-slate-800">${e.studentName}</td>
                        <td class="p-3"><span class="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-slate-100">${e.group}</span></td>
                        <td class="p-3 text-slate-600">[${e.evaluatorRole}] ${e.evaluatorName}</td>
                        <td class="p-3 text-center font-bold text-blue-600">${e.scores.c1}</td>
                        <td class="p-3 text-center font-bold text-emerald-600">${e.scores.c2}</td>
                        <td class="p-3 text-center font-bold text-amber-600">${e.scores.c3}</td>
                        <td class="p-3 text-center font-bold text-purple-600">${e.scores.c4}</td>
                        <td class="p-3 text-center font-bold text-rose-600">${e.scores.c5}</td>
                        <td class="p-3 max-w-xs truncate text-slate-600" title="${e.comment}">${e.comment}</td>
                        <td class="p-3 text-center">
                            <button onclick="deleteSingleEval('${e.id}')" class="text-rose-500 hover:text-rose-700 p-1">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function deleteSingleEval(id) {
            evaluations = evaluations.filter(e => e.id !== id);
            saveData();
            renderStudents();
            renderHistoryTable();
            renderIndividualTrendChart();
        }

        // Export to Excel (.xlsx)
        function exportToExcel() {
            if (evaluations.length === 0) {
                alert('出力する評価データがまだありません。');
                return;
            }

            // Sheet 1: 全評価ログ
            const logData = evaluations.map(e => ({
                '日時': new Date(e.timestamp).toLocaleString('ja-JP'),
                'チーム': e.group,
                '学生名': e.studentName,
                '記入者役職': e.evaluatorRole,
                '記入者氏名': e.evaluatorName,
                '1.論点整理・前提理解': e.scores.c1,
                '2.課題特定': e.scores.c2,
                '3.根拠・論拠の明確さ': e.scores.c3,
                '4.巻き込み・合意形成': e.scores.c4,
                '5.他者尊重': e.scores.c5,
                '所感メモ': e.comment
            }));

            // Sheet 2: 学生別サマリー
            const summaryData = students.map(s => {
                const sEvals = evaluations.filter(e => e.studentId === s.id);
                const count = sEvals.length;
                let avg1 = 0, avg2 = 0, avg3 = 0, avg4 = 0, avg5 = 0, overallAvg = 0;

                if (count > 0) {
                    avg1 = (sEvals.reduce((a, b) => a + b.scores.c1, 0) / count).toFixed(2);
                    avg2 = (sEvals.reduce((a, b) => a + b.scores.c2, 0) / count).toFixed(2);
                    avg3 = (sEvals.reduce((a, b) => a + b.scores.c3, 0) / count).toFixed(2);
                    avg4 = (sEvals.reduce((a, b) => a + b.scores.c4, 0) / count).toFixed(2);
                    avg5 = (sEvals.reduce((a, b) => a + b.scores.c5, 0) / count).toFixed(2);
                    overallAvg = ((parseFloat(avg1) + parseFloat(avg2) + parseFloat(avg3) + parseFloat(avg4) + parseFloat(avg5)) / 5).toFixed(2);
                }

                return {
                    'チーム': s.group,
                    '学生名': s.name,
                    'フリガナ': s.kana,
                    '評価入力回数': count,
                    '平均_論点整理': count > 0 ? avg1 : '-',
                    '平均_課題特定': count > 0 ? avg2 : '-',
                    '平均_根拠明確さ': count > 0 ? avg3 : '-',
                    '平均_巻き込み': count > 0 ? avg4 : '-',
                    '平均_他者尊重': count > 0 ? avg5 : '-',
                    '総合平均点': count > 0 ? overallAvg : '-'
                };
            });

            const wb = XLSX.utils.book_new();
            const wsLogs = XLSX.utils.json_to_sheet(logData);
            const wsSummary = XLSX.utils.json_to_sheet(summaryData);

            XLSX.utils.book_append_sheet(wb, wsLogs, "全評価ログ");
            XLSX.utils.book_append_sheet(wb, wsSummary, "学生別サマリー");

            const fileName = `TURE-TECH_評価データ_${new Date().toISOString().slice(0, 10)}.xlsx`;
            XLSX.writeFile(wb, fileName);
        }
    </script>
</body>
</html>
